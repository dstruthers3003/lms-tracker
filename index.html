<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LMS">
<meta name="theme-color" content="#10349e">
<title>Last Man Standing — Tracker</title>
<style>
/* ---- tokens ----
   Palette taken from a printed football wallchart: newsprint paper, ink,
   pitch green for the brand, and three status colours that never share a hue. */
:root{
  --paper:#f5f7fc; --card:#ffffff; --ink:#0f1421; --ink-2:#44506b; --ink-3:#73809c;
  --line:#d8e0f2; --line-2:#eceff8;
  --pitch:#10349e; --pitch-2:#1b4bd8;
  --through:#10349e; --through-bg:#e7ecfb;
  --out:#c8102e;     --out-bg:#fdeaee;
  --review:#8c1b2f;  --review-bg:#fbeef0;
  --idle:#73809c;    --idle-bg:#eef1f8;
  --r:6px; --s:4px;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.02em}
h1{font-size:26px}h2{font-size:19px}h3{font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
a{color:var(--pitch-2)}
button,select,input,textarea{font-family:inherit;font-size:14px}
:focus-visible{outline:2px solid var(--pitch-2);outline-offset:2px}

/* ---- shell ---- */
.top{background:var(--pitch);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.top h1{font-size:20px;color:#fff}
.top .sub{color:#b9c8f2;font:12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase}
.top .spacer{flex:1}
.roundpick{display:flex;align-items:center;gap:8px}
.roundpick select{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:var(--r);padding:8px 10px;min-height:40px}
.roundpick select option{color:#000}

nav{background:var(--card);border-bottom:1px solid var(--line);padding:0 12px;display:flex;gap:2px;overflow-x:auto;position:sticky;top:0;z-index:20}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:14px 14px;min-height:48px;cursor:pointer;color:var(--ink-2);font-weight:600;white-space:nowrap}
nav button:hover{color:var(--ink)}
nav button[aria-current="true"]{color:var(--pitch);border-bottom-color:var(--pitch)}
nav .badge{display:inline-block;min-width:18px;padding:1px 5px;margin-left:6px;border-radius:9px;background:var(--review);color:#fff;font:11px/1.5 var(--mono)}

main{max-width:1180px;margin:0 auto;padding:24px 16px 80px}
.page{display:none}.page.on{display:block}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:16px}
.hd{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.hint{color:var(--ink-3);font-size:13px;margin:4px 0 0}

/* ---- surfaces ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card+.card{margin-top:16px}
.card>h3{margin-bottom:12px}

/* ---- stat strip: the round at a glance ---- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{background:var(--card);padding:14px 16px}
.stat .k{font:11px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.stat .v{font-size:28px;font-weight:800;letter-spacing:-.03em;margin-top:6px}
.stat .v small{font-size:14px;font-weight:600;color:var(--ink-3)}

/* ---- buttons ---- */
.btn{background:var(--pitch);color:#fff;border:1px solid var(--pitch);border-radius:var(--r);padding:9px 14px;min-height:40px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--pitch-2)}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--line-2)}
.btn.danger{background:var(--out);border-color:var(--out)}
.btn.sm{padding:5px 9px;min-height:32px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---- forms ---- */
input[type=text],input[type=number],input[type=date],select,textarea{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:9px 10px;min-height:40px;width:100%;color:var(--ink)}
textarea{min-height:150px;font:13px/1.5 var(--mono);resize:vertical}
label.f{display:block;font:11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.field{flex:1;min-width:180px}

/* ---- tables ---- */
table{width:100%;border-collapse:collapse}
th{text-align:left;font:11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#f8faff}
.num{font-family:var(--mono);text-align:right;white-space:nowrap}
.tw{overflow-x:auto}

/* ---- pills ---- */
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font:11px/1.7 var(--mono);letter-spacing:.04em;text-transform:uppercase;font-weight:600;white-space:nowrap}
.pill.through{background:var(--through-bg);color:var(--through)}
.pill.out{background:var(--out-bg);color:var(--out)}
.pill.review{background:var(--review-bg);color:var(--review);box-shadow:inset 0 0 0 1px #e8c3ca}
.pill.idle{background:var(--idle-bg);color:var(--idle)}
.flags{font-size:12px;color:var(--review);display:block;margin-top:3px;line-height:1.4}
.quote{font:12px/1.45 var(--mono);color:var(--ink-3);display:block;margin-top:3px;max-width:340px;white-space:pre-wrap}

/* ---- progress ---- */
.bar{height:10px;background:var(--line-2);border-radius:20px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--through)}

/* ---- WALLCHART: the signature view ---- */
.wallchart{border:1px solid var(--line);border-radius:var(--r);overflow:auto;background:var(--card)}
.wallchart table{border-collapse:separate;border-spacing:0;min-width:max-content}
.wallchart th,.wallchart td{border-bottom:1px solid var(--line-2);padding:0}
.wallchart th.gw{width:64px;text-align:center;padding:8px 4px}
.wallchart th.who,.wallchart td.who{position:sticky;left:0;background:var(--card);border-right:1px solid var(--line);padding:8px 12px;min-width:170px;z-index:2}
.wallchart tr.dead td.who{color:var(--ink-3)}
.cell{display:block;margin:3px;height:34px;border-radius:4px;display:flex;align-items:center;justify-content:center;
  font:12px/1 var(--mono);font-weight:700;letter-spacing:.04em;background:var(--idle-bg);color:var(--ink-3)}
.cell.w{background:var(--through-bg);color:var(--through);box-shadow:inset 0 -3px 0 var(--through)}
.cell.l{background:var(--out-bg);color:var(--out);box-shadow:inset 0 -3px 0 var(--out)}
.cell.p{background:var(--review-bg);color:var(--review);box-shadow:inset 0 -3px 0 var(--review)}
.cell.pending{background:var(--card);border:1px dashed var(--line);color:var(--ink-3)}
.cell.auto::after{content:"·A";opacity:.6}
.cell.empty{background:transparent}

/* ---- result buttons ---- */
.wdl{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.wdl button{background:var(--card);border:0;border-right:1px solid var(--line);padding:0 12px;height:36px;min-width:40px;cursor:pointer;font-weight:700;font-family:var(--mono);color:var(--ink-3)}
.wdl button:last-child{border-right:0}
.wdl button[aria-pressed="true"]{color:#fff}
.wdl button.w[aria-pressed="true"]{background:var(--through)}
.wdl button.d[aria-pressed="true"],.wdl button.l[aria-pressed="true"]{background:var(--out)}
.wdl button.p[aria-pressed="true"]{background:var(--review)}

/* ---- misc ---- */
.empty{text-align:center;padding:40px 16px;color:var(--ink-3)}
.empty p{margin:8px 0 16px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:12px 18px;border-radius:var(--r);z-index:100;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:90vw}
.attention li{margin-bottom:6px}
.chk{display:flex;align-items:center;gap:8px;min-height:32px}
.chk input{width:18px;height:18px;min-height:0}
details summary{cursor:pointer;font-weight:600;padding:6px 0}
.mini{font-size:12px;color:var(--ink-3)}
@media (max-width:640px){
  main{padding:16px 10px 60px}
  .stat .v{font-size:22px}
  .top h1{font-size:17px}
}



/* ---- phones: Greg runs the whole thing from an iPhone ---- */
@media (max-width:560px){
  body{font-size:16px}                       /* 16px stops iOS zooming on focus */
  input,select,textarea{font-size:16px;min-height:46px}
  .btn{min-height:46px;padding:11px 16px}
  .btn.sm{min-height:40px}
  main{padding:12px 10px 72px}
  .hd{gap:6px}
  h1{font-size:21px}
  .top{padding:11px 14px}
  .top h1{font-size:16px}
  .top .sub{display:none}
  .roundpick{width:100%}
  nav{padding:0 6px;gap:0}
  nav button{padding:12px 11px;font-size:14px}
  .two-up{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr}
  .stat{padding:11px 12px}
  .stat .v{font-size:19px}
  .stat .v small{display:block;font-size:12px}
  .card{padding:13px}
  .qcard{padding:15px;border-radius:8px}
  .qgrid{grid-template-columns:1fr;gap:10px}
  .qbar{flex-direction:column;align-items:stretch}
  .qbar .btn{width:100%}
  .drop{padding:16px 12px}
  textarea{min-height:110px}
  .field{min-width:0;max-width:none !important;width:100%}
  .row{gap:9px}
  /* the date range: three datetime pickers side by side is unusable on a phone */
  .row.dates{display:block}
  .row.dates .field{margin-bottom:12px}
  .row.dates > div:last-child{width:100%}
  .row.dates .btn{width:100%}
  input[type="datetime-local"]{width:100%;min-height:48px;padding:10px 12px}

  /* tables become stacked cards — five columns don't fit a phone */
  table.stack thead{display:none}
  table.stack tr{display:block;border:1px solid var(--line);border-radius:7px;padding:10px 12px;margin-bottom:9px;background:var(--card)}
  table.stack td{display:block;border:0;padding:3px 0}
  table.stack td:before{content:attr(data-l);display:inline-block;min-width:74px;
    font:11px/1.6 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
  table.stack td.num{text-align:left}
  .wallchart th.who,.wallchart td.who{min-width:118px}
  .prog{flex-wrap:wrap}
}
@media (max-width:560px) and (display-mode:standalone){ main{padding-bottom:96px} }

/* ---- can't-save warning ---- */
.savewarn{background:var(--out-bg);color:var(--out);border-bottom:1px solid var(--out);
  padding:12px 20px;font-size:14px;font-weight:600;text-align:center}
.savewarn button{margin-left:10px}

/* ---- simplified shell ---- */
nav .moretoggle{color:var(--ink-3);font-weight:600}
nav .more-tabs{display:contents}
nav .more-tabs[hidden]{display:none}
.two-up{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:900px){ .row.dates .field{max-width:none !important;flex:1 1 220px} }
@media (max-width:720px){.two-up{grid-template-columns:1fr}}
.bigbtn{font-size:16px;padding:14px 22px;min-height:52px}
.qcard{border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:20px;max-width:760px;margin:0 auto}
.qcard .said{background:var(--paper);border-left:3px solid var(--line);padding:12px 14px;border-radius:4px;
  font:13px/1.55 var(--mono);white-space:pre-wrap;margin:12px 0;max-height:220px;overflow:auto}
.qcard h2{margin-bottom:4px}
.qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0}
.qbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:18px;padding-top:16px;border-top:1px solid var(--line-2)}
.prog{display:flex;align-items:center;gap:12px;margin-bottom:16px;max-width:760px;margin-left:auto;margin-right:auto}
.prog .bar{flex:1}
.kbd{font:11px/1.6 var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:var(--ink-3)}
.done-state{text-align:center;padding:48px 16px;max-width:600px;margin:0 auto}
.done-state .tick{font-size:44px;line-height:1}

/* ---- upload zones ---- */
.drop{border:2px dashed var(--line);border-radius:var(--r);background:#fbfaf8;padding:20px 16px;text-align:center;transition:border-color .15s,background .15s}
.drop.over{border-color:var(--pitch);background:var(--through-bg)}
.drop-in{display:flex;flex-direction:column;align-items:center;gap:8px}
.drop-in strong{font-size:15px}
.drop-in .mini{max-width:520px}
details.paste{margin-top:12px}
details.paste summary{color:var(--ink-3);font-size:13px;font-weight:600}
details.paste[open] summary{margin-bottom:8px}
</style>
</head>
<body>

<header class="top">
  <div>
    <h1>Last Man Standing</h1>
    <div class="sub">Premier League · WhatsApp league admin</div>
  </div>
  <div class="spacer"></div>
  <div class="roundpick">
    <label class="f" for="roundSel" style="color:#b9c8f2;margin:0">Round</label>
    <select id="roundSel"></select>
    <button class="btn ghost sm" data-act="exportJson" title="Download a backup">Backup</button>
  </div>
</header>

<nav>
  <button data-page="home">1 · Upload</button>
  <button data-page="review">2 · Check<span class="badge" id="navBadge"></span></button>
  <button data-page="list">3 · Spreadsheet</button>
  <button class="moretoggle" data-act="toggleMore">More ▾</button>
  <span class="more-tabs" id="moreTabs" hidden>
  <button data-page="dashboard">Dashboard</button>
  <button data-page="setup">Set up round</button>
  <button data-page="payments">Payments</button>
  <button data-page="picks">Picks</button>
  <button data-page="results">Results</button>
  <button data-page="wallchart">Wallchart</button>
  <button data-page="players">Players</button>
  <button data-page="honours">Roll of honour</button>
  <button data-page="settings">Settings</button>
  </span>
</nav>

<div id="saveWarn" class="savewarn" hidden></div>

<main>
  <section class="page on" id="p-home"></section>
  <section class="page" id="p-review"></section>
  <section class="page" id="p-list"></section>
  <section class="page" id="p-dashboard"></section>
  <section class="page" id="p-setup"></section>
  <section class="page" id="p-payments"></section>
  <section class="page" id="p-picks"></section>
  <section class="page" id="p-results"></section>
  <section class="page" id="p-wallchart"></section>
  <section class="page" id="p-players"></section>
  <section class="page" id="p-honours"></section>
  <section class="page" id="p-settings"></section>
</main>

<script>
/* ============================================================
   LMS CORE — pure logic. No DOM. Testable in node.
   ============================================================ */
(function (root) {
'use strict';

/* ---------- 1. CLUBS & ALIASES ---------- */
// Covers current PL plus recent up/down clubs so the app survives promotion churn.
const CLUBS = [
  { name:'Arsenal',                  code:'ARS', aliases:['arsenal','ars','gunners','afc','arse'] },
  { name:'Aston Villa',              code:'AVL', aliases:['aston villa','villa','avfc','avl','villans','the villa'] },
  { name:'AFC Bournemouth',          code:'BOU', aliases:['bournemouth','afc bournemouth','afcb','bou','cherries','bmth'] },
  { name:'Brentford',                code:'BRE', aliases:['brentford','bees','bfc','bre','brent'] },
  { name:'Brighton & Hove Albion',   code:'BHA', aliases:['brighton','brighton and hove albion','brighton & hove albion','bha','seagulls','albion','brighton hove'] },
  { name:'Burnley',                  code:'BUR', aliases:['burnley','clarets','bfc burnley','bur'] },
  { name:'Chelsea',                  code:'CHE', aliases:['chelsea','cfc','che','chels','chelski'] },
  { name:'Crystal Palace',           code:'CRY', aliases:['crystal palace','palace','cpfc','cry','eagles'] },
  { name:'Everton',                  code:'EVE', aliases:['everton','efc','eve','toffees','everton fc'] },
  { name:'Fulham',                   code:'FUL', aliases:['fulham','ffc','ful','cottagers'] },
  { name:'Ipswich Town',             code:'IPS', aliases:['ipswich','ipswich town','itfc','ips','tractor boys'] },
  { name:'Leeds United',             code:'LEE', aliases:['leeds','leeds united','lufc','lee','whites'] },
  { name:'Leicester City',           code:'LEI', aliases:['leicester','leicester city','lcfc','lei','foxes'] },
  { name:'Liverpool',                code:'LIV', aliases:['liverpool','lfc','liv','pool','the reds','scousers','liverpool fc'] },
  { name:'Manchester City',          code:'MCI', aliases:['man city','manchester city','mcfc','mci','citeh','mancity','man c','city of manchester','city','man city.'] },
  { name:'Manchester United',        code:'MUN', aliases:['man utd','manchester united','man united','mufc','mun','man u','manutd','red devils','utd','man ure','united','man utd.','manchester utd'] },
  { name:'Newcastle United',         code:'NEW', aliases:['newcastle','newcastle united','nufc','new','toon','magpies','newc','the toon'] },
  { name:'Nottingham Forest',        code:'NFO', aliases:['forest','forrest','nottingham forest','nottingham forrest','nottm forest','nottm forrest','notts forest','notts forrest','nffc','nfo','tricky trees'] },
  { name:'Sheffield United',         code:'SHU', aliases:['sheffield united','sheff utd','sheff united','blades','shu'] },
  { name:'Southampton',              code:'SOU', aliases:['southampton','saints','sou','soton','sfc'] },
  { name:'Sunderland',               code:'SUN', aliases:['sunderland','safc','sun','black cats','mackems'] },
  { name:'Tottenham Hotspur',        code:'TOT', aliases:['spurs','tottenham','tottenham hotspur','thfc','tot','the spurs','tott','lilywhites'] },
  { name:'West Ham United',          code:'WHU', aliases:['west ham','west ham united','whu','hammers','irons','westham','w ham'] },
  { name:'Wolverhampton Wanderers',  code:'WOL', aliases:['wolves','wolverhampton','wolverhampton wanderers','wwfc','wol','wanderers'] }
];

// Aliases that legitimately point at more than one club. Primary first.
// The parser resolves these to the primary but marks them for human review.
const AMBIGUOUS = {
  'utd':      ['Manchester United','Newcastle United','Leeds United','West Ham United','Sheffield United'],
  'united':   ['Manchester United','Newcastle United','Leeds United','West Ham United','Sheffield United'],
  'city':     ['Manchester City','Leicester City','Ipswich Town'],
  'blues':    ['Chelsea','Everton','Ipswich Town'],
  'reds':     ['Liverpool','Nottingham Forest'],
  'albion':   ['Brighton & Hove Albion'],
  'afc':      ['Arsenal','AFC Bournemouth'],
  'wanderers':['Wolverhampton Wanderers'],
  'new':      ['Newcastle United'],
  'sun':      ['Sunderland'],
  'pool':     ['Liverpool'],
  'saints':   ['Southampton']
};

// Words that look like aliases but almost never are a pick in isolation.
// Short codes that are also people's names — only count when the message is just that word.
const ALIAS_BLOCKLIST = new Set(['new','sun','the','in','out','lee','eve','che','cry','sou','bur','bre','bou','ips','lei','mun','nfo','shu','tot','whu','wol','ars','liv','mci','avl','bha','cfc','ful']);

function clubByName(n){ return CLUBS.find(c => c.name === n) || null; }

// Build a longest-first alias index once.
const ALIAS_INDEX = (function(){
  const list = [];
  CLUBS.forEach(c => c.aliases.forEach(a => list.push({ alias:a, club:c.name })));
  list.sort((x,y) => y.alias.length - x.alias.length);
  return list;
})();

/* ---------- 2. TEXT NORMALISATION ---------- */
function tidy(s){
  return String(s == null ? '' : s)
    .replace(/[‎‏‪-‮﻿]/g,'')  // WhatsApp bidi junk
    .replace(/ | /g,' ')                     // narrow / non-breaking space
    .replace(/[’‘`]/g,"'")
    .replace(/[“”]/g,'"');
}
function norm(s){
  return tidy(s).toLowerCase()
    .replace(/[^a-z0-9&\s'-]/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}
function escapeRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }

/* ---------- 3. TEAM RESOLUTION ---------- */
/**
 * Find every club mentioned in a piece of text.
 * Returns [{club, alias, index, ambiguous:[...]|null}] in order of appearance,
 * with overlapping matches removed (longest alias wins).
 */
function findTeams(text){
  const hay = ' ' + norm(text) + ' ';
  const hits = [];
  const taken = [];
  for (const entry of ALIAS_INDEX){
    if (ALIAS_BLOCKLIST.has(entry.alias) && norm(text) !== entry.alias) continue;
    const re = new RegExp('(?<![a-z0-9])' + escapeRe(entry.alias) + '(?![a-z0-9])','g');
    let m;
    while ((m = re.exec(hay)) !== null){
      const start = m.index, end = m.index + entry.alias.length;
      if (taken.some(t => start < t[1] && end > t[0])) continue; // overlap
      taken.push([start,end]);
      hits.push({
        club: entry.club,
        alias: entry.alias,
        index: start,
        ambiguous: AMBIGUOUS[entry.alias] && AMBIGUOUS[entry.alias].length > 1
          ? AMBIGUOUS[entry.alias] : null
      });
    }
  }
  hits.sort((a,b) => a.index - b.index);
  return hits;
}

/** Single best club for a short string, or null. */
function resolveTeam(text){
  const hits = findTeams(text);
  return hits.length ? hits[0] : null;
}

/* ---------- 4. PEOPLE MATCHING ---------- */
function levenshtein(a,b){
  if (a === b) return 0;
  const m = a.length, n = b.length;
  if (!m || !n) return m || n;
  let prev = Array.from({length:n+1},(_,i)=>i), cur = new Array(n+1);
  for (let i=1;i<=m;i++){
    cur[0]=i;
    for (let j=1;j<=n;j++){
      cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a[i-1]===b[j-1]?0:1));
    }
    [prev,cur] = [cur,prev];
  }
  return prev[n];
}

/**
 * Match a free-text name to entries.
 * entries: [{id, name, aliases:[]}]
 * Returns {entry, score, exact, candidates:[]} or null.
 */
function matchPerson(raw, entries){
  const q = norm(raw);
  if (!q) return null;
  const cands = [];
  for (const e of entries){
    const names = [e.name].concat(e.aliases || []);
    for (const nm of names){
      const n2 = norm(nm);
      if (!n2) continue;
      const parts = n2.split(' ');
      const first = parts[0];
      const last  = parts.length > 1 ? parts[parts.length-1] : '';
      if (n2 === q) { cands.push({entry:e, score:1.00, how:'exact'}); continue; }
      // Andy/Andrew, Mcfarlane/Macfarlane — the same person written two ways
      const qp = q.split(' ');
      if (qp.length === 2 && parts.length >= 2
          && sameFirst(qp[0], first) && sameSur(qp[qp.length-1], last)){
        const exactish = qp[0] === first && qp[qp.length-1] === last;
        cands.push({entry:e, score: exactish ? 1.00 : 0.93, how:'name variant'}); continue;
      }
      if (first === q) { cands.push({entry:e, score:0.90, how:'first-name'}); continue; }
      // "P Nair" / "P.Nair" style bank references
      const ini = /^([a-z])[.\s]+([a-z]{3,})$/.exec(q);
      if (ini && last && sameSur(ini[2], last) && first[0] === ini[1]){
        cands.push({entry:e, score:0.88, how:'initial+surname'}); continue;
      }
      // "NAIR P" reversed reference
      const rev = /^([a-z]{3,})[.\s]+([a-z])$/.exec(q);
      if (rev && last && rev[1] === last && first[0] === rev[2]){
        cands.push({entry:e, score:0.86, how:'surname+initial'}); continue;
      }
      if (last && last === q && last.length >= 4){ cands.push({entry:e, score:0.82, how:'surname'}); continue; }
      // "BROWN PDI", "STEVENSON R & L" — surname then the initials on the account
      const si = /^([a-z'’\-]{3,})\s+([a-z](?:\s*[&,]?\s*[a-z]){0,3})$/.exec(q);
      if (si && last && sameSur(si[1], last)){
        const inits = si[2].replace(/[^a-z]/g,'').split('');
        if (inits.includes(first[0])){ cands.push({entry:e, score:0.86, how:'surname+initials'}); continue; }
      }
      // "BEN W" — first name then the surname initial
      const fi = /^([a-z'’\-]{2,})\s+([a-z])$/.exec(q);
      if (fi && last && sameFirst(fi[1], first) && fi[2] === last[0]){
        cands.push({entry:e, score:0.84, how:'firstname+initial'}); continue;
      }
      if (n2.startsWith(q) && q.length >= 3) { cands.push({entry:e, score:0.80, how:'prefix'}); continue; }
      // edit distance is the expensive bit, so only bother when the start matches
      if (q.length >= 4 && (q[0] === n2[0] || q[0] === first[0] || (last && q[0] === last[0]))){
        const d = Math.min(levenshtein(q, first), levenshtein(q, n2));
        if (d <= (q.length > 6 ? 2 : 1)) cands.push({entry:e, score:0.70 - d*0.1, how:'fuzzy'});
      }
    }
  }
  if (!cands.length) return null;
  cands.sort((a,b) => b.score - a.score);
  const best = cands[0];
  const tiedIds = new Set(cands.filter(c => c.score === best.score).map(c => c.entry.id));
  return {
    entry: best.entry,
    score: best.score,
    how: best.how,
    ambiguous: tiedIds.size > 1,
    candidates: [...tiedIds]
  };
}

/** Pull plausible person-names out of a message (roster-driven, so no NER needed). */
function findPeople(text, entries, strict){
  const t = norm(text);
  const found = [];
  for (const e of entries){
    for (const nm of [e.name].concat(e.aliases||[])){
      const n2 = norm(nm);
      if (!n2) continue;
      const parts = n2.split(' ');
      const probes = [n2];
      if (parts.length > 1){
        const last = parts[parts.length-1];
        probes.push(parts[0][0] + ' ' + last);                    // "p nair"
        if (!strict){
          probes.push(parts[0]);                                  // first name
          if (last.length >= 4) probes.push(last);                // surname
        }
      }
      let hit = null;
      for (const p of probes){
        if (p.length < 3) continue;
        if (strict && !p.includes(' ')) continue;   // "David" is not enough to go on
        const re = new RegExp('(?<![a-z])' + escapeRe(p) + '(?![a-z])');
        const m = re.exec(t);
        if (m && (hit === null || m.index < hit.index)) hit = { entry:e, index:m.index, matched:p };
      }
      if (hit) found.push(hit);
    }
  }
  // de-dupe by entry, keep earliest mention
  const seen = new Map();
  found.forEach(f => { if (!seen.has(f.entry.id) || seen.get(f.entry.id).index > f.index) seen.set(f.entry.id, f); });
  return [...seen.values()].sort((a,b)=>a.index-b.index);
}

/* ---------- 5. WHATSAPP PARSER ---------- */
const SYSTEM_PATTERNS = [
  /messages and calls are end-to-end encrypted/i,
  /<media omitted>|image omitted|sticker omitted|video omitted|gif omitted|audio omitted|document omitted/i,
  /this message was deleted|you deleted this message/i,
  /^\s*(added|removed|left|joined|created group|changed the subject|changed this group|changed their phone number|changed the group description|pinned a message|turned on disappearing)/i,
  /created group ".*"/i,
  /security code changed/i,
  /^null$/i
];

// [12/08/2026, 19:04:32] Dave: text     |     12/08/2026, 19:04 - Dave: text
const HEAD_RE = /^\s*\[?(\d{1,2}[\/.]\d{1,2}[\/.]\d{2,4}),?\s+(\d{1,2}:\d{2}(?::\d{2})?)\s*([apAP]\.?[mM]\.?)?\]?\s*(?:-\s*)?([^:]{1,80}?):\s?([\s\S]*)$/;

function parseDate(dStr, tStr, ampm, dayFirst){
  const sep = dStr.includes('/') ? '/' : '.';
  let [p1,p2,p3] = dStr.split(sep).map(Number);
  let day, month;
  if (dayFirst === false){ month = p1; day = p2; } else { day = p1; month = p2; }
  // sanity flip: 13/06 can only be day-first
  if (month > 12 && day <= 12){ const t = day; day = month; month = t; }
  let year = p3 < 100 ? 2000 + p3 : p3;
  let [hh,mm,ss] = tStr.split(':').map(Number);
  if (ampm){
    const pm = /p/i.test(ampm);
    if (pm && hh < 12) hh += 12;
    if (!pm && hh === 12) hh = 0;
  }
  return new Date(year, month-1, day, hh||0, mm||0, ss||0);
}

/**
 * Parse a raw WhatsApp export into messages.
 * opts.dayFirst: true (UK, default) | false (US)
 */
function parseWhatsApp(raw, opts){
  opts = opts || {};
  const dayFirst = opts.dayFirst !== false;
  const lines = tidy(raw).split(/\r?\n/);
  const msgs = [];
  let cur = null;
  for (const line of lines){
    const m = HEAD_RE.exec(line);
    if (m){
      if (cur) msgs.push(cur);
      cur = {
        date: parseDate(m[1], m[2], m[3], dayFirst),
        dateRaw: m[1], timeRaw: m[2],
        sender: tidy(m[4]).trim(),
        body: m[5] || ''
      };
    } else if (cur){
      cur.body += '\n' + line;              // continuation of a multi-line message
    }
    // lines before the first header (or system lines without a sender) are dropped
  }
  if (cur) msgs.push(cur);
  return msgs
    .map((x,i) => ({ ...x, idx:i, body: x.body.trim() }))
    .filter(x => x.body && !SYSTEM_PATTERNS.some(p => p.test(x.body)));
}

/* ---------- 6. PICK EXTRACTION ---------- */
const NOISE_RE = /\b(good luck|gl|cheers|thanks|thank you|lol|haha|banter|who[' ]?s left|deadline|reminder|anyone|link|table|paid|sent|transfer|monzo|is out|are out|went out|beat|beats|beaten|lost to|won against|smashed|hammered|vs|v\b|played|score|result)\b/i;
const PROXY_AFTER  = /\b(?:for|on behalf of|4)\b/i;
const PICK_VERBS   = /\b(pick|picks|picking|picked|choose|chooses|choosing|chose|going|goes|go|gone|have|has|had|takes|taking|take|i'?ll|ill|gonna|want|wants|in with|with|selects?|selection)\b/i;

/**
 * Turn parsed messages into candidate picks.
 * entries: [{id,name,aliases}]
 * Returns [{msgIdx, date, sender, entryId, entryName, club, alias, confidence, flags:[], quote}]
 */
function extractPicks(msgs, entries, opts){
  opts = opts || {};
  const out = [];
  for (const msg of msgs){
    const senderMatch = matchPerson(msg.sender, entries);
    // split the message into segments — people often list several picks in one message
    const segments = msg.body
      .split(/\n|(?<=[a-z0-9)])\s*[,;]\s*(?=[A-Za-z])|\s+-\s+|\s+\/\s+/)
      .map(s => s.trim()).filter(Boolean);

    for (const seg of segments){
      const teams = findTeams(seg);
      if (!teams.length) continue;

      const flags = [];
      const isNoise = NOISE_RE.test(seg) && !PICK_VERBS.test(seg);
      if (isNoise) flags.push('looks-like-chat-not-a-pick');

      const people = findPeople(seg, entries);
      // people mentioned before/after the team decide who the pick belongs to
      let targets = [];
      if (people.length){
        targets = people.map(p => p.entry);
        if (/\b(and|&|\+)\s*me\b|\bme and\b|\bmyself\b/i.test(seg) && senderMatch){
          if (!targets.some(t => t.id === senderMatch.entry.id)) targets.unshift(senderMatch.entry);
        }
      } else if (senderMatch){
        targets = [senderMatch.entry];
      }

      if (!targets.length){
        out.push({
          msgIdx: msg.idx, date: msg.date, sender: msg.sender,
          entryId: null, entryName: msg.sender,
          club: teams[0].club, alias: teams[0].alias,
          confidence: 'low', flags: flags.concat('sender-not-in-roster'),
          quote: seg
        });
        continue;
      }

      // one team, several people => same pick for all. Several teams & several people => pair them up in order.
      const pairs = [];
      if (teams.length === 1){
        targets.forEach(t => pairs.push([t, teams[0]]));
      } else if (teams.length === targets.length){
        targets.forEach((t,i) => pairs.push([t, teams[i]]));
        flags.push('multi-pick-message');
      } else {
        targets.forEach(t => pairs.push([t, teams[0]]));
        flags.push('multiple-teams-mentioned');
      }

      for (const [t, tm] of pairs){
        const f = flags.slice();
        if (tm.ambiguous) f.push('ambiguous-alias:' + tm.alias + ' → ' + tm.ambiguous.join(' / '));
        const proxied = !senderMatch || t.id !== senderMatch.entry.id;
        if (proxied) f.push('picked-on-behalf-by:' + msg.sender);
        if (senderMatch && senderMatch.ambiguous) f.push('sender-name-ambiguous');

        let confidence = 'high';
        if (f.some(x => x.startsWith('ambiguous-alias')) || f.includes('looks-like-chat-not-a-pick')
            || f.includes('multiple-teams-mentioned') || f.includes('sender-name-ambiguous')) confidence = 'low';
        else if (proxied || f.includes('multi-pick-message')) confidence = 'medium';

        out.push({
          msgIdx: msg.idx, date: msg.date, sender: msg.sender,
          entryId: t.id, entryName: t.name,
          club: tm.club, alias: tm.alias,
          confidence, flags: f, quote: seg
        });
      }
    }
  }
  return out;
}

/** Last pick per entry wins; earlier ones recorded as superseded. */
function collapsePicks(picks){
  const byEntry = new Map();
  for (const p of picks){
    const k = p.entryId || ('~' + p.entryName);
    if (!byEntry.has(k)) byEntry.set(k, []);
    byEntry.get(k).push(p);
  }
  const final = [];
  for (const [,list] of byEntry){
    list.sort((a,b) => (a.date - b.date) || (a.msgIdx - b.msgIdx));
    const last = list[list.length-1];
    const changed = list.filter(p => p.club !== last.club);
    if (changed.length){
      last.flags = last.flags.concat('changed-pick-from:' + [...new Set(changed.map(c=>c.club))].join(', '));
      if (last.confidence === 'high') last.confidence = 'medium';
    }
    last.supersededCount = list.length - 1;
    final.push(last);
  }
  return final;
}

/* ---------- 7. MONZO PARSER ---------- */
function splitCSVLine(line){
  const out = []; let cur = ''; let q = false;
  for (let i=0;i<line.length;i++){
    const ch = line[i];
    if (q){
      if (ch === '"' && line[i+1] === '"'){ cur += '"'; i++; }
      else if (ch === '"') q = false;
      else cur += ch;
    } else {
      if (ch === '"') q = true;
      else if (ch === ',') { out.push(cur); cur=''; }
      else cur += ch;
    }
  }
  out.push(cur);
  return out.map(s => tidy(s).trim());
}

function parseMonzoCSV(raw){
  const lines = tidy(raw).split(/\r?\n/).filter(l => l.trim().length);
  if (!lines.length) return { rows: [], headers: [] };
  const headers = splitCSVLine(lines[0]).map(h => h.toLowerCase().trim());
  const col = (...names) => {
    for (const n of names){
      const i = headers.findIndex(h => h === n);
      if (i >= 0) return i;
    }
    for (const n of names){
      const i = headers.findIndex(h => h.includes(n));
      if (i >= 0) return i;
    }
    return -1;
  };
  const cDate = col('date','created','transaction date','date created');
  const cTime = col('time');
  const cName = col('name','title','counterparty','payer','from');
  const cAmt  = col('amount','money in','value');
  const cIn   = col('money in');
  let cDesc = col('description','reference','subtitle');
  let cNote = col('notes and #tags','notes','reference','subtitle');
  if (cDesc >= 0 && cDesc === cNote) cNote = -1;      // one reference column, not two
  const cType = col('type');

  const rows = [];
  for (let i=1;i<lines.length;i++){
    const c = splitCSVLine(lines[i]);
    if (c.length < 2) continue;
    let amtRaw = cAmt >= 0 ? c[cAmt] : '';
    if ((!amtRaw || isNaN(parseFloat(amtRaw))) && cIn >= 0) amtRaw = c[cIn];
    const amount = parseFloat(String(amtRaw).replace(/[£$€,\s]/g,''));
    if (isNaN(amount)) continue;
    let dRaw = cDate >= 0 ? c[cDate] : '';
    let tRaw = cTime >= 0 ? c[cTime] : '';
    if (/,/.test(dRaw)){                       // "31/08/26, 13:55" in a single column
      const parts = dRaw.split(',');
      dRaw = parts[0].trim();
      if (!tRaw) tRaw = (parts[1]||'').trim();
    }
    rows.push({
      line: i,
      date: dRaw,
      time: tRaw,
      name: cName >= 0 ? c[cName] : '',
      amount,
      description: cDesc >= 0 ? c[cDesc] : '',
      notes: cNote >= 0 ? c[cNote] : '',
      type: cType >= 0 ? c[cType] : '',
      raw: lines[i]
    });
  }
  return { rows, headers };
}

/**
 * Match incoming credits to entries.
 * Handles one person paying for several entries (£33 = 3 x £11) by reading names
 * out of the payment reference.
 */
function matchPayments(rows, entries, fee){
  fee = fee || 11;
  // collapse the per-line entries into one row per person
  const people = [];
  const byPerson = new Map();
  entries.forEach(e => {
    const k = e.personId || norm(e.name);
    if (!byPerson.has(k)){
      byPerson.set(k, { id:k, name:e.name, aliases:e.aliases||[], lines:[] });
      people.push(byPerson.get(k));
    }
    byPerson.get(k).lines.push(e);
  });
  // two different people with the same name can't be told apart from a bank reference
  const dupNames = new Set();
  const seenName = new Map();
  people.forEach(p => {
    const k = norm(p.name);
    if (seenName.has(k) && seenName.get(k) !== p.id) dupNames.add(k);
    seenName.set(k, p.id);
  });

  const results = [];
  for (const r of rows){
    if (r.amount <= 0) continue;                       // credits only
    if (/pot transfer|pot withdrawal/i.test(r.type||'')) continue;

    const blob = [r.name, r.description, r.notes].filter(Boolean).join(' ');
    const units = r.amount / fee;
    const wholeUnits = Math.abs(units - Math.round(units)) < 0.001 ? Math.round(units) : null;
    const need = wholeUnits || 1;

    const payer = matchPerson(r.name, people);
    const ref   = matchPerson([r.description, r.notes].filter(Boolean).join(' '), people);
    // Account names are often "SURNAME INITIALS" while the reference carries the real
    // name, so whichever is the stronger match leads.
    let strong = null, via = '';
    if (payer && payer.score >= 0.8){ strong = payer; via = 'payer name'; }
    if (ref && ref.score >= 0.9 && (!strong || ref.score > payer.score)){ strong = ref; via = 'the reference'; }
    // other full names mentioned in the reference ("JAMIE MCC JOHN MCC")
    const extras = findPeople(blob, people, true).map(x => x.entry)
      .filter(p => !strong || p.id !== strong.entry.id);

    const order = (strong ? [strong.entry] : []).concat(extras);
    const assigned = [];
    for (const p of order){
      if (assigned.length >= need) break;
      // confirming someone who already said they'd paid is the whole point
      const free = p.lines.filter(l => !l.bankPaid && !assigned.some(a => a.id === l.id));
      const take = (p === order[0] && order.length === 1) ? need - assigned.length : 1;
      free.slice(0, Math.max(1, take)).forEach(l => {
        if (assigned.length < need) assigned.push({ id:l.id, name:l.name, line:l.line });
      });
    }

    const flags = [];
    if (wholeUnits === null) flags.push('£' + r.amount + " isn't a multiple of £" + fee);
    else if (wholeUnits > 1) flags.push('covers ' + wholeUnits + ' lines');
    if (!strong && !extras.length) flags.push('no player of that name');
    else if (!strong) flags.push('only matched through the reference');
    else if (via === 'the reference') flags.push('matched on the reference, not the account name');
    if (assigned.length < need) flags.push('covers ' + need + ' lines but only ' + assigned.length + ' to confirm');
    if (payer && payer.score < 0.8 && payer.score >= 0.6) flags.push('closest name was ' + payer.entry.name);
    if (strong && dupNames.has(norm(strong.entry.name)))
      flags.push('more than one player called ' + strong.entry.name + ' — check this is the right one');
    if (payer && payer.ambiguous) flags.push('that name matches more than one player');

    let confidence = 'high';
    if (!assigned.length || wholeUnits === null || !strong) confidence = 'low';
    else if (dupNames.has(norm(strong.entry.name)) || payer.ambiguous) confidence = 'low';
    else if (flags.length) confidence = 'medium';

    results.push({ row: r, units: wholeUnits, assigned, confidence, flags });
  }
  return results;
}

/* ---------- 8. COMPETITION ENGINE ---------- */
/**
 * Auto-pick rule (house rule): a player who misses the deadline is given the
 * next team alphabetically that they have not already used this round.
 */
function autoPick(usedClubs, availableClubs){
  const used = new Set(usedClubs);
  const pool = (availableClubs && availableClubs.length ? availableClubs : CLUBS.map(c=>c.name))
    .slice().sort((a,b) => a.localeCompare(b));
  for (const c of pool) if (!used.has(c)) return c;
  return null;
}

/**
 * Settle one gameweek.
 * round: {entries:[{id,name,status,eliminatedGw}], picks:{entryId:{gw:club}}, ...}
 * results: {club: 'W'|'D'|'L'|'P'}   P = postponed/void
 * Returns {survivors, eliminated, autoAssigned, unresolved, potSplit}
 */
function settleGameweek(round, gw, results, opts){
  opts = opts || {};
  const voidSurvives = opts.voidSurvives !== false;   // postponed game = survive by default
  const alive = round.entries.filter(e => e.status === 'alive');
  const out = { gw, survivors: [], eliminated: [], autoAssigned: [], unresolved: [], unpaid: [] };

  for (const e of alive){
    const epicks = (round.picks[e.id] || {});
    const club = epicks[gw];
    if (!club){
      out.unresolved.push({ entry:e, reason:'no pick submitted — choose one before settling' });
      continue;
    }
    if (opts.requirePaid && e.paid === false){
      out.unpaid.push({ entry:e, club });
      continue;
    }
    const res = results[club];
    if (!res){ out.unresolved.push({ entry:e, club, reason:'no result entered for ' + club }); continue; }
    if (res === 'W') out.survivors.push({ entry:e, club });
    else if (res === 'P') (voidSurvives ? out.survivors : out.eliminated).push({ entry:e, club, voidGame:true });
    else out.eliminated.push({ entry:e, club, result:res });
  }
  out.wipeout = out.survivors.length === 0 && out.eliminated.length > 0;
  return out;
}

/** Has this entry already used this club in the current round? */
function isReuse(round, entryId, club, gw){
  const p = round.picks[entryId] || {};
  return Object.keys(p).some(k => Number(k) !== Number(gw) && p[k] === club);
}

function stripTeams(text){
  let t = ' ' + text + ' ';
  for (const e of ALIAS_INDEX){
    if (e.alias.length < 3) continue;
    t = t.replace(new RegExp('(?<![a-z0-9])' + escapeRe(e.alias) + '(?![a-z0-9])','gi'), ' | ');
  }

/** Flatten a message into something a name can be pulled out of. */
function prepName(text){
  return String(text)
    .replace(/<\s*this message was edited\s*>|<\s*edited\s*>|this message was deleted/gi,' | ')
    .replace(/@[⁨⁩]?~?\s*([^⁩\n]{1,40})[⁩]?/g, ' $1 ')   // @⁨~Blair Eusebi⁩ -> Blair Eusebi
    .replace(/https?:\/\/\S+/g,' ')
    .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{1F3FB}-\u{1F3FF}\u{2700}-\u{27BF}]/gu,' ')
    .replace(/£\s?\d+(\.\d+)?/g,' ')
    .replace(/([a-zA-Z])(\d)/g,'$1 $2')          // Anderson1 -> Anderson 1
    .replace(/(\d)([a-zA-Z])/g,'$1 $2')
    .replace(/[^\p{L}\d'’\s]+/gu,' | ')          // punctuation becomes a boundary
    .replace(/\s+/g,' ')
    .trim();
}
const isNameWord = w => {
  const c = w.replace(/^['’\-]+|['’\-]+$/g,'');
  if (c.length < 2 || c.length > 20) return false;
  if (!/^[\p{L}'’\-]+$/u.test(c)) return false;
  return !NAME_STOP.has(c.toLowerCase());
};
const titleCase = s => s.split(/\s+/).map(w =>
  // McClafferty, MacLeod, O'Donnell keep their shape; BELL JC from a bank feed doesn't
  (/[A-Z]/.test(w.slice(1)) && /[a-z]/.test(w)) ? w
  : w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ');

/** Every plausible person-name in a message, longest runs first. */
function nameCandidates(text){
  const clean = prepName(stripTeams(text));
  const runs = [];
  clean.split(/\s*\|\s*|\d+/).forEach(chunk => {
    const words = chunk.split(/\s+/).filter(Boolean);
    let run = [];
    const flush = () => {
      if (run.length){
        for (let len = Math.min(3, run.length); len >= 1; len--){
          for (let i = 0; i + len <= run.length; i++){
            const words = run.slice(i, i+len);
            const dedup = words.filter((w,j) => j === 0 || norm(w) !== norm(words[j-1]));
            runs.push({ name: titleCase(dedup.join(' ')), words: dedup.length });
          }
        }
      }
      run = [];
    };
    words.forEach(w => { isNameWord(w) ? run.push(w.replace(/^['’\-]+|['’\-]+$/g,'')) : flush(); });
    flush();
  });
  return runs;
}

/** Best guess at a person's real name from what they typed. */
function guessName(text, pushName){
  const cands = nameCandidates(text);
  const push = norm(pushName.replace(/^~\s*/,''));
  const pushWords = push.split(' ').filter(Boolean);
  const pushIsFull = pushWords.length >= 2 && pushWords.every(w => /^[a-z'’\-]+$/.test(w));
  if (!cands.length){
    return { name: pushName, confidence: pushIsFull ? 'medium' : 'low',
             reason: 'no name typed — using their WhatsApp name' };
  }
  const score = c => {
    let s = c.words === 2 ? 100 : c.words === 3 ? 70 : 30;
    const w = norm(c.name).split(' ');
    if (w.some(x => pushWords.includes(x))) s += 30;
    if (pushWords.includes(w[0])) s += 25;      // their own first name, not their mate's
    return s;
  };
  cands.sort((a,b) => score(b) - score(a));
  const best = cands[0];
  const agrees = norm(best.name).split(' ').some(x => pushWords.includes(x));
  if (best.words < 2 && pushIsFull){
    return { name: titleCase(pushName.replace(/^~\s*/,'')), confidence:'medium',
             reason:'only a first name typed — using their WhatsApp name' };
  }
  return {
    name: best.name,
    confidence: best.words >= 2 ? (agrees ? 'high' : 'medium') : 'low',
    reason: best.words >= 2 ? (agrees ? '' : "doesn't match their WhatsApp name") : 'only one word to go on'
  };
}

/** How many lines is this person taking, and why do we think so? */
function countLines(text, fee, mainName, organiser){
  const t = ' ' + prepName(stripTeams(text)).toLowerCase() + ' ';
  const evidence = [];
  let n = 1;
  let paidCount = null;
  const amt = /£\s?(\d+(?:\.\d+)?)/.exec(text)
           || /\b(?:paid|payed|sent|sending|transferred)\s*£?\s?(\d{2,3})\b/i.exec(text)
           || /\b(\d{1,2})\s*x\s*£\s?(\d{1,3})\b/i.exec(text);
  if (amt){
    const v = amt[2] !== undefined ? parseFloat(amt[1]) * parseFloat(amt[2]) : parseFloat(amt[1]);
    if (v % fee === 0 && v >= fee){ paidCount = v / fee; n = Math.max(n, paidCount); evidence.push('paid £' + v); }
  }
  const x = /\bx\s?(\d{1,2})\b|\b(\d{1,2})\s?x\b/.exec(' ' + text.toLowerCase() + ' ');
  if (x){ const v = +(x[1]||x[2]); if (v>=1 && v<=20){ n = Math.max(n, v); evidence.push('"x' + v + '"'); } }
  const words = { one:1, two:2, three:3, four:4, five:5, six:6 };
  const lines = /\b(\d{1,2}|one|two|three|four|five|six)\s+(lines?|entries|entrys|goes|spots|teams)\b/.exec(t);
  if (lines){
    const v = words[lines[1]] || +lines[1];
    if (v>=1 && v<=20){ n = Math.max(n, v); evidence.push(lines[0].trim()); }
  }
  // "Name 2", "Pick 2", "2 =" — a number above 1 implies that many lines
  // read digits from the raw text, so "m8", "l8r" and "gr8" don't become line counts
  const nums = new Set();
  let m;
  const rawT = ' ' + tidy(text).replace(/£\s?\d+(\.\d+)?/g,' ') + ' ';
  const numRe = /(?:^|[\s\-=:.,)(\[\]])(\d{1,2})(?=$|[\s\-=:.,)(\[\]])/g;
  while ((m = numRe.exec(rawT)) !== null){ const v = +m[1]; if (v>=1 && v<=20) nums.add(v); }
  if (nums.size){
    const mx = Math.max(...nums);
    if (mx > 1){ n = Math.max(n, mx); evidence.push('numbered up to ' + mx); }
  }
  // Several people in one message — but only count names written the way an entry is
  // written: "Grahame Atkinson - Arsenal". Names buried mid-sentence are chatter.
  const seen = new Set(), full = [];
  String(text).split(/\n|\s\|\s/).forEach(line => {
    const cands = nameCandidates(line).filter(c => c.words === 2);
    if (!cands.length) return;
    const c = cands[0];                                  // first proper name on the line
    const k = norm(c.name);
    if (seen.has(k)) return;
    if (organiser && isOrganiser(k, organiser)) return;  // @-mentioning Greg isn't an entry
    // Brothers share a surname, so only treat it as the same person when the first name
    // matches and the other word is too short to be a real surname ("Josh ack").
    const kw = k.split(' ');
    if ([...seen].some(s => { const sw = s.split(' ');
      return sw[0] === kw[0] && (sw[1] || '').length < 4 !== ((kw[1] || '').length < 4)
             || sw.join(' ') === k; })) return;
    seen.add(k); full.push(c.name);
  });
  if (full.length > 1){ n = Math.max(n, full.length); evidence.push('names: ' + full.join(', ')); }
  const forMe = /\b(me and|myself and|for me and|and me\b|my \w+ and)/i.test(text);
  if (forMe && full.length >= 1){ n = Math.max(n, full.length + 1); evidence.push('"me and…"'); }
  else if (full.length >= 1){
    const joiners = (text.match(/\s(?:and|&|\+)\s/gi) || []).length;
    if (joiners >= 1 && joiners + 1 > n){ n = Math.max(n, joiners + 1); evidence.push('joined by "and"'); }
  }
  // Note the disagreement; whether the money or the names wins is decided by the
  // caller, which knows whether anyone was actually named beside a team.
  if (paidCount && n > paidCount) evidence.push('£' + (paidCount * fee) + ' mentioned but ' + n + ' suggested elsewhere');
  return { lines: Math.min(n, 20), evidence, names: full, paidCount };
}

/**
 * Work out who a message is actually entering, and which team belongs to whom.
 * People write the owner beside the team — "Everton for Graeme Bell", "Arsenal for me" —
 * so names are read line by line and bound to the team on that line. The sender comes
 * first when they've entered themselves, because line 1 is theirs.
 */
function nameRuns(line){
  const clean = prepName(stripTeams(line));
  const runs = [];
  clean.split(/\s*\|\s*|\d+/).forEach(chunk => {
    let run = [];
    const flush = () => { if (run.length) runs.push(run.slice()); run = []; };
    chunk.split(/\s+/).filter(Boolean).forEach(w => {
      isNameWord(w) ? run.push(w.replace(/^['’\-]+|['’\-]+$/g,'')) : flush();
    });
    flush();
  });
  // "Mick nolan lauren brown" is two people, so take consecutive pairs
  const names = [];
  runs.forEach(run => {
    for (let i = 0; i + 1 < run.length; i += 2) names.push(titleCase(run[i] + ' ' + run[i+1]));
    if (run.length % 2 === 1 && run.length > 2) { /* odd word left over — not enough to name anyone */ }
  });
  return names;
}
/**
 * Is this name the organiser? People call Greg Chamberlain "Chamby", "the Chambys",
 * "Chambo" — all of which were turning up as players. Derived from his surname, so a
 * real Greg (Greg Sykes, Greg Henderson) is untouched.
 */
function isOrganiser(name, organiser){
  if (!organiser || !name) return false;
  const o = norm(organiser), n = norm(name).replace(/^(da|the|mr)\s+/,'').replace(/s$/,'');
  if (!n) return false;
  if (n === o) return true;
  const parts = o.split(' ');
  const surname = parts[parts.length-1];
  if (n === surname) return true;
  // a nickname built off the surname: Chamberlain -> Chamby, Chambo, Chambz.
  // "Chambers" is somebody's actual surname, so it has to look like a nickname.
  if (surname.length >= 6 && !n.includes(' ') && n.length >= 4 && n.length < surname.length
      && surname.startsWith(n.slice(0, Math.min(5, n.length - 1)))
      && /[yoiez]$/.test(n)) return true;
  return false;
}

const NICK_OF = (function(){
  const m = {};
  NICKNAMES.forEach(set => set.forEach(n => { m[n] = set[0]; }));
  return m;

const canonFirst = w => NICK_OF[w] || w;
/** Mac and Mc are the same prefix as far as matching goes. */
const canonSur = w => String(w||'').replace(/^mac(?=[a-z]{3})/,'mc').replace(/[^a-z]/g,'');
const sameFirst = (a,b) => a === b || canonFirst(a) === canonFirst(b);
const sameSur   = (a,b) => a === b || (a && b && canonSur(a) === canonSur(b));

/** A WhatsApp display name that's a phone number or punctuation isn't a person. */
function plausibleName(s){ return /[a-z]{2}/i.test(String(s||'')) && !/^\+?[\d\s()-]+$/.test(String(s||'').trim()); }
/** A lone first name sitting beside a team: "Seve - Villa", "Dave: Arsenal". */
function soloName(line){
  const t = prepName(stripTeams(line));
  const m = /(^|\|)\s*([A-Za-z][A-Za-z'’-]{1,19})\s*(\||$)/.exec(t);
  if (!m) return null;
  const w = m[2];
  if (NAME_STOP.has(w.toLowerCase()) || w.length < 3) return null;
  return titleCase(w);
}

/** "Josh ack" is Josh Atkinson acknowledging, not a second Josh. */
function samePerson(a, b){
  if (a === b) return true;
  const A = a.split(' '), B = b.split(' ');
  if (A[0] !== B[0]) return false;
  return ((A[1]||'').length < 4) !== ((B[1]||'').length < 4);
}

/**
 * Work out who a message is entering and which team belongs to whom. People write the
 * owner beside the team — "Everton for Graeme Bell", "Arsenal for me" — so names are
 * read line by line and bound to the team on that line. Someone naming themselves
 * against several different teams is taking several lines.
 */
function extractMembers(text, sender, opts){
  const organiser = opts && opts.organiser ? norm(opts.organiser) : '';
  const raw = String(sender || '').replace(/^~\s*/,'').trim();
  // "G" or a phone number is still a person — just one we can't name yet
  const selfName = plausibleName(raw) ? titleCase(raw) : (raw ? 'Unnamed (' + raw + ')' : '');
  const selfKey = norm(selfName);
  const hits = [];                                   // {name, team} in the order written
  String(text).split(/\n|\s\|\s/).forEach(line => {
    const teams = findTeams(line);
    const team = teams.length ? teams[0].club : null;
    const named = nameRuns(line).filter(n => !isOrganiser(n, organiser));
    const selfRef = /\b(me|myself|my own|mine)\b/i.test(line);
    const coordinated = /\b(me|myself)\s+and\b|\band\s+(me|myself)\b/i.test(line);
    if (named.length){
      named.forEach((n, i) => hits.push({ name:n, team: i === 0 ? team : null }));
      // "Arsenal for me" right after writing their own name is still just them
      if (coordinated && selfName && !named.some(n => norm(n) === selfKey))
        hits.push({ name:selfName, team:null });
    } else if (selfRef && selfName){
      hits.push({ name:selfName, team });
    } else if (team){
      // "Seve - Villa" — one word is enough when it sits right beside a team
      const solo = soloName(line);
      if (solo) hits.push({ name:solo, team });
    }
  });
  if (!hits.length) return [];

  // fold the aliases of one person together, keeping each distinct team they named
  const people = [];
  hits.forEach(h => {
    const k = norm(h.name);
    if (!k || isOrganiser(k, organiser)) return;
    let p = people.find(q => samePerson(q.key, k));
    if (!p){ p = { key:k, name:h.name, teams:[] }; people.push(p); }
    if (p.name.split(' ').length < h.name.split(' ').length) p.name = h.name;
    if (h.team && !p.teams.includes(h.team)) p.teams.push(h.team);
  });

  const members = [];
  people.forEach(p => {
    if (!p.teams.length) members.push({ name:p.name, team:null });
    else p.teams.forEach(t => members.push({ name:p.name, team:t }));
  });
  // the sender's own line is line 1
  members.sort((a,b) => (norm(a.name) === selfKey ? -1 : 0) - (norm(b.name) === selfKey ? -1 : 0));
  return members;
}

/**
 * Read an announcement thread and propose the entrant list.
 * Returns [{sender, name, lines, paid, paidAmount, picks:{line:club}, flags, quote}]
 */
function buildEntrants(msgs, opts){
  opts = opts || {};
  const fee = opts.fee || 11;
  const bySender = new Map();
  for (const m of msgs){
    const s = m.sender.replace(/^~\s*/,'').trim();
    if (opts.organiser && isOrganiser(s, opts.organiser)) continue;
    if (/^last man standing$/i.test(s)) continue;          // the group's own notices
    if (!bySender.has(s)) bySender.set(s, []);
    bySender.get(s).push(m);
  }
  const out = [];
  for (const [sender, list] of bySender){
    const text = list.map(m => m.body).join('\n');
    const paid = PAID_RE.test(text);
    if (!paid && !findTeams(text).length) continue;          // pure chat, not an entry

    const nm = guessName(text, sender);
    const lc = countLines(text, fee, nm.name, opts.organiser);
    const mem0 = extractMembers(text, sender, opts);

    // Names beside teams beat anything guessed from the message as a whole.
    if (mem0.length && plausibleName(mem0[0].name)){
      nm.name = mem0[0].name;
      nm.confidence = mem0.length > 1 ? 'medium' : nm.confidence;
      nm.reason = mem0.length > 1 ? 'entering ' + mem0.length + ' people: ' + mem0.map(x=>x.name).join(', ') : nm.reason;
    }
    // someone typing "@Greg Chamberlain" shouldn't turn Greg into an entrant
    if (opts.organiser && isOrganiser(nm.name, opts.organiser)){
      nm.name = titleCase(sender); nm.confidence = 'low';
      nm.reason = 'only the organiser was named — using their WhatsApp name';
    }
    const pw = norm(sender).split(' ').filter(Boolean);
    if (!mem0.length && lc.lines > 1 && pw.length >= 2 && !pw.includes(norm(nm.name).split(' ')[0])){
      nm.name = titleCase(sender); nm.confidence = 'medium';
      nm.reason = 'paying for more than one — first line assumed to be theirs';
    }
    // An amount only caps the count when nobody was actually named. "£11 sent for
    // David Swan" is one payment out of several, not the whole entry.
    if (!mem0.length && lc.paidCount && lc.lines > lc.paidCount){
      lc.evidence.push('going with the £' + (lc.paidCount * fee) + ' rather than the names mentioned');
      lc.lines = lc.paidCount;
    }
    if (!plausibleName(nm.name)){
      nm.name = 'Unnamed (' + String(sender).replace(/^~\s*/,'').trim() + ')';
      nm.confidence = 'low';
      nm.reason = 'no name given and their WhatsApp name is no help — needs a name';
    }
    const flags = [];
    if (nm.reason) flags.push(nm.reason);
    if (lc.evidence.length) flags.push(lc.evidence.join(', '));
    if (lc.paidCount && lc.names && lc.names.length > lc.paidCount)
      flags.push('names ' + lc.names.length + ' people but paid for ' + lc.paidCount);
    if (!paid) flags.push('no payment mentioned');
    if (LATER_RE.test(text) ) flags.push('said picks would follow');

    // Who does each team belong to? People write the owner's name next to it
    // ("Everton for Graeme Bell"), so bind by name first and only fall back to
    // the order teams were mentioned in when there's no name to go on.
    const members = mem0;
    if (members.length > lc.lines){
      lc.lines = members.length;
      lc.evidence.push('named ' + members.length + ' people');
    }

    const picks = {};
    const perLine = /(?:pick|line|entry)\s*(\d{1,2})\s*[-=:.)]?\s*([^\n]{0,40})/gi;
    let m2, matched = false;
    while ((m2 = perLine.exec(text)) !== null){
      const line = +m2[1];
      if (line < 1 || line > lc.lines) continue;
      const t = findTeams(m2[2]);
      if (t.length){ picks[line] = t[0].club; matched = true; }
    }
    // members win over numbering: they carry a name, not just a position
    members.forEach((mem, i) => { if (mem.team){ picks[i+1] = mem.team; matched = true; } });

    const allTeams = findTeams(text).map(t => t.club);
    if (!matched){
      allTeams.slice(0, lc.lines).forEach((t,i) => picks[i+1] = t);
      if (allTeams.length > lc.lines) flags.push('more teams mentioned than lines');
    } else {
      const spare = allTeams.filter(t => !Object.values(picks).includes(t));
      for (let i = 1; i <= lc.lines && spare.length; i++) if (!picks[i]) picks[i] = spare.shift();
    }
    if (Object.keys(picks).length && Object.keys(picks).length < lc.lines) flags.push('only ' + Object.keys(picks).length + ' of ' + lc.lines + ' picks given');
    const amt = /£\s?(\d+(?:\.\d+)?)/.exec(text);

    let confidence = nm.confidence;
    if (!paid) confidence = 'low';
    else if (flags.some(f => /single word|more teams|names \d+ people/.test(f))) confidence = 'low';
    else if (flags.some(f => /doesn't match/.test(f))) confidence = 'medium';

    out.push({
      sender, name: nm.name, lines: lc.lines, paid, members,
      paidAmount: amt ? parseFloat(amt[1]) : (paid ? fee * lc.lines : 0),
      picks, confidence, flags,
      quote: text.length > 220 ? text.slice(0,220) + '…' : text,
      when: list[0].date
    });
  }
  return out.sort((a,b) => a.when - b.when);
}


/* ---------- 10. RESULTS IMPORT ---------- */
/**
 * Read a pasted results list. Copes with the shapes you get from the Premier League
 * site and from most other places:
 *   Arsenal 2 - 1 Chelsea      Arsenal 2 Chelsea 1      Arsenal\n2\n1\nChelsea
 * Fixtures without a score (Arsenal v Chelsea) are ignored.
 */
function parseResults(text){
  const out = [], problems = [];
  const blocks = tidy(text).split(/\n{2,}/);
  const scan = chunk => {
    const hay = ' ' + norm(chunk) + ' ';
    const toks = [];
    const taken = [];
    for (const entry of ALIAS_INDEX){
      if (entry.alias.length < 3) continue;
      const re = new RegExp('(?<![a-z0-9])' + escapeRe(entry.alias) + '(?![a-z0-9])','g');
      let m;
      while ((m = re.exec(hay)) !== null){
        const s = m.index, e = s + entry.alias.length;
        if (taken.some(t => s < t[1] && e > t[0])) continue;
        taken.push([s,e]);
        toks.push({ t:'team', v:entry.club, i:s });
      }
    }
    let m2; const numRe = /(?<![a-z0-9])(\d{1,2})(?![a-z0-9])/g;
    while ((m2 = numRe.exec(hay)) !== null) toks.push({ t:'num', v:+m2[1], i:m2.index });
    toks.sort((a,b)=>a.i-b.i);
    return toks;
  };
  const consume = toks => {
    let i = 0;
    while (i < toks.length){
      const a = toks[i];
      if (a.t !== 'team'){ i++; continue; }
      const b = toks[i+1], c = toks[i+2], d = toks[i+3];
      if (b && c && d && b.t==='num' && c.t==='num' && d.t==='team'){
        out.push({ home:a.v, hs:b.v, away:d.v, as:c.v }); i += 4; continue;
      }
      if (b && c && d && b.t==='num' && c.t==='team' && d.t==='num'){
        out.push({ home:a.v, hs:b.v, away:c.v, as:d.v }); i += 4; continue;
      }
      if (b && b.t==='team'){ problems.push(a.v + ' v ' + b.v + ' — no score'); i += 2; continue; }
      problems.push(a.v + ' — couldn\'t find a score'); i++;
    }
  };
  blocks.forEach(bl => consume(scan(bl)));
  const seen = new Set(), games = [];
  for (const g of out){
    const k = g.home + '|' + g.away;
    if (seen.has(k)) continue;
    seen.add(k); games.push(g);
  }
  return { games, problems };
}

/** Turn parsed fixtures into the W/D/L map the settlement engine wants. */
function resultsMap(games){
  const map = {};
  for (const g of games){
    map[g.home] = g.hs > g.as ? 'W' : g.hs === g.as ? 'D' : 'L';
    map[g.away] = g.as > g.hs ? 'W' : g.hs === g.as ? 'D' : 'L';
  }
  return map;
}


/**
 * Find where the current game was announced. Greg re-posts the same message as a
 * reminder, so take the latest announcement and then walk back to its first posting —
 * otherwise the days of entries in between get thrown away.
 */
function findAnnouncement(msgs, organiser){
  const strong = /new last man standing|new game of last man standing/i;
  const loose  = /last man standing.*(starting|start)|new game|starting (on|next|this)/i;
  const org = organiser ? norm(organiser) : '';
  const mine = msgs.filter(m => !org || norm(m.sender.replace(/^~\s*/,'')) === org);
  let hits = mine.filter(m => strong.test(m.body));
  if (!hits.length) hits = mine.filter(m => loose.test(m.body));
  if (!hits.length) return null;
  const last = hits[hits.length - 1];
  const sig = s => norm(s).replace(/[^a-z0-9 ]/g,'').slice(0, 60);
  const key = sig(last.body);
  let first = last;
  for (const m of hits){
    if (sig(m.body) !== key) continue;
    if ((last.date - m.date) / 86400000 > 120) continue;   // last season's identical post
    first = m; break;
  }
  return first;
}

/* ---------- attention engine: what needs David tonight ---------- */
function attention(){
  const r = round(); const items = [];
  if (!r) return items;
  if (!r.entries.length) items.push({p:'setup', t:'No entries yet — build the list from the announcement thread on Set up round.'});
  const unpaid = r.entries.filter(e => !e.paid);
  if (unpaid.length) items.push({p:'payments', t:unpaid.length + ' still to pay: ' + unpaid.map(entryName).join(', ')});
  else if (r.entries.length && !r.locked) items.push({p:'payments', t:'Everyone has paid — lock the round in.'});

  const gw = r.currentGw;
  const alive = aliveEntries(r);
  if (!deadlineOf(r, gw)) items.push({p:'picks', t:'No deadline set for GW' + gw + '.'});
  const missing = alive.filter(e => !(r.picks[e.id]||{})[gw]);
  if (alive.length && missing.length) items.push({p:'picks', t:missing.length + ' without a GW' + gw + ' pick — pick for them manually: ' + missing.map(entryName).join(', ')});
  const clubs = pickedClubs(r, gw);
  const noRes = clubs.filter(c => !(r.results[gw]||{})[c]);
  if (clubs.length && noRes.length && !missing.length) items.push({p:'results', t:'Enter results for: ' + noRes.join(', ')});
  if (clubs.length && !noRes.length && !r.settled[gw]) items.push({p:'results', t:'GW' + gw + ' results are in — settle the week.'});
  return items;
}
function pickedClubs(r, gw){
  const set = new Set();
  aliveEntries(r).forEach(e => { const c = (r.picks[e.id]||{})[gw]; if (c) set.add(c); });
  return [...set].sort();
}

function renderWall(r){
  const gws = Array.from({length:r.currentGw},(_,i)=>i+1);
  if (ui.wallAlive === undefined) ui.wallAlive = r.entries.length > 80;
  const rows = r.entries
    .filter(e => (!ui.wallAlive || e.status === 'alive') &&
                 (!ui.wallFilter || entryName(e).toLowerCase().includes(ui.wallFilter.toLowerCase())))
    .sort((a,b)=>{
    if ((a.status==='alive') !== (b.status==='alive')) return a.status==='alive'?-1:1;
    if (a.status!=='alive' && b.status!=='alive') return b.eliminatedGw-a.eliminatedGw;
    return entryName(a).localeCompare(entryName(b));
  });
  $('#p-wallchart').innerHTML = `
  <div class="hd"><h1>Wallchart</h1><span class="mini">${esc(r.name)} · ${aliveEntries(r).length} still in</span></div>
  <div class="row" style="margin-bottom:14px">
    <button class="btn" data-act="copySummary">Copy WhatsApp update</button>
    <button class="btn ghost" data-act="exportCsv">Download CSV</button>
    <span class="mini">Green = through · red = out · amber = postponed · dashed = no pick yet</span>
  </div>
  <div class="row" style="margin-bottom:12px">
    <div class="field" style="max-width:280px"><input type="text" placeholder="Find a player…" value="${esc(ui.wallFilter||'')}" data-act="wallFilter"></div>
    <label class="chk"><input type="checkbox" ${ui.wallAlive?'checked':''} data-act="wallAlive"> only those still in</label>
    <span class="mini">${rows.length} of ${r.entries.length} shown</span>
  </div>
  <div class="wallchart"><table><thead><tr><th class="who">Player</th>
    ${gws.map(g=>`<th class="gw">GW${g}</th>`).join('')}<th class="gw">Status</th></tr></thead><tbody>
    ${rows.slice(0,300).map(e=>{
      const dead = e.status!=='alive';
      return `<tr class="${dead?'dead':''}"><td class="who"><strong>${esc(entryName(e))}</strong>${e.paid?'':'<span class="mini"> · unpaid</span>'}</td>
      ${gws.map(g=>{
        const club = (r.picks[e.id]||{})[g];
        if (dead && g > e.eliminatedGw) return '<td><span class="cell empty"></span></td>';
        if (!club) return `<td><span class="cell pending">—</span></td>`;
        const res = (r.results[g]||{})[club];
        const settled = r.settled[g];
        const cls = !settled ? 'pending' : res==='W' ? 'w' : res==='P' ? 'p' : 'l';
        return `<td><span class="cell ${cls}" title="${esc(club)}${res?' · '+res:''}">${esc(codeOf(club))}</span></td>`;
      }).join('')}
      <td><span class="cell ${e.status==='void'?'p':dead?'l':'w'}">${e.status==='void'?'N/A':dead?'OUT':'IN'}</span></td></tr>`;
    }).join('')}
  </tbody></table></div>
  ${r.entries.length?'':'<div class="empty"><h2>Nothing to chart yet</h2><p>Add players and record a gameweek.</p></div>'}`;
}

function summaryText(r){
  const gw = r.currentGw - (r.settled[r.currentGw-1] ? 1 : 0);
  const settledGw = Object.keys(r.settled).filter(k=>r.settled[k]).map(Number).sort((a,b)=>a-b).pop() || 0;
  const alive = aliveEntries(r);
  const outThis = r.entries.filter(e=>e.status!=='alive' && e.eliminatedGw===settledGw);
  const lines = [];
  lines.push(`${r.name} — after GW${settledGw||r.currentGw}`);
  lines.push(`Pot: ${money(pot(r))}`);
  lines.push('');
  lines.push(`STILL IN (${alive.length})`);
  alive.forEach(e=>lines.push(`- ${entryName(e)}`));
  if (outThis.length){
    lines.push('');
    lines.push(`OUT THIS WEEK (${outThis.length})`);
    outThis.forEach(e=>lines.push(`- ${entryName(e)} (${(r.picks[e.id]||{})[settledGw]||'no pick'})`));
  }
  if (alive.length === 1) lines.push(`\n🏆 ${entryName(alive[0])} is the last man standing — ${money(pot(r))}`);
  else if (alive.length === 0) lines.push(`\nEveryone's out — ${money(pot(r))} rolls over to the next round. Shout if you're in or out for the restart.`);
  else {
    const dl = (r.deadlines||{})[r.currentGw];
    lines.push(`\nGW${r.currentGw} picks by ${dl ? fmtDeadline(dl) : 'the deadline'} please. No pick, no entry — I'm not picking for you.`);
  }
  return lines.join('\n');
}
function csvText(r){
  const gws = Array.from({length:r.currentGw},(_,i)=>i+1);
  const q = s => '"' + String(s==null?'':s).replace(/"/g,'""') + '"';
  const head = ['Player','Paid','Status','Eliminated GW'].concat(gws.map(g=>'GW'+g)).concat(gws.map(g=>'GW'+g+' result'));
  const rows = r.entries.map(e=>[entryName(e), e.paid?'Y':'N', e.status, e.eliminatedGw||'']
    .concat(gws.map(g=>(r.picks[e.id]||{})[g]||''))
    .concat(gws.map(g=>{const c=(r.picks[e.id]||{})[g]; return c?((r.results[g]||{})[c]||''):'';})));
  return [head, ...rows].map(r2=>r2.map(q).join(',')).join('\n');
}

function download(name, text, type){
  const b = new Blob([text], {type:type||'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}

const ACT = {
  go: (el)=> go(el.dataset.page),

  /* players */
  addPerson(){
    const n = $('#npName').value.trim(); if (!n) return toast('Give them a name first.');
    const al = $('#npAlias').value.split(',').map(s=>s.trim()).filter(Boolean);
    state.people.push({id:uid(), name:n, aliases:al});
    save(); render();
  },
  bulkPeople(){
    const txt = prompt('Paste one name per line (or comma separated):');
    if (!txt) return;
    txt.split(/[\n,]/).map(s=>s.trim()).filter(Boolean).forEach(n=>{
      if (!state.people.some(p=>L.norm(p.name)===L.norm(n))) state.people.push({id:uid(), name:n, aliases:[]});
    });
    save(); render();
  },
  editPerson(el){
    const p = person(el.dataset.id); if (!p) return;
    if (el.dataset.f==='name') p.name = el.value;
    else p.aliases = el.value.split(',').map(s=>s.trim()).filter(Boolean);
    save();
  },
  delPerson(el){
    if (!confirm('Remove this player from the master list? Their entries stay in past rounds.')) return;
    state.people = state.people.filter(p=>p.id!==el.dataset.id);
    save(); render();
  },
  toggleInRound(el){
    const r = round(), pid = el.dataset.id;
    const ex = r.entries.find(e=>e.personId===pid);
    if (ex){
      if (r.locked && !confirm('This round is locked. Remove them anyway?')) return render();
      r.entries = r.entries.filter(e=>e.id!==ex.id); delete r.picks[ex.id];
    } else {
      r.entries.push({id:uid(), personId:pid, paid:false, paidAmount:0, paidDate:'', paidRef:'', paidBy:'', status:'alive', eliminatedGw:null});
    }
    save(); render();
  },

  /* payments */
  parseMonzo(){
    const r = round();
    const txt = ($('#monzoText') && $('#monzoText').value) || ui.monzoText || '';
    ui.monzoText = txt;
    if (!txt.trim()) return toast('Paste the CSV first.');
    const { rows } = L.parseMonzoCSV(txt);
    if (!rows.length) return toast("Couldn't find any transactions in that.");
    ui.pendingPays = L.matchPayments(rows, matchEntries(r), r.fee || state.settings.fee);
    if (!ui.pendingPays.length) return toast('No incoming payments in that statement.');
    toast(ui.pendingPays.length + ' credits found.');
    render();
  },
  clearMonzo(){ if($('#monzoText')) $('#monzoText').value=''; ui.monzoText=''; ui.pendingPays=[]; if(ui.lastUpload&&ui.lastUpload.act==='uploadMonzo') ui.lastUpload=null; render(); },
  payAssign(el){
    const p = ui.pendingPays[+el.dataset.i];
    const ids = [...el.selectedOptions].map(o=>o.value);
    const r = round();
    p.assigned = ids.map(id=>({id, name: entryName(r.entries.find(e=>e.id===id)||{})}));
    render();
  },
  applyPays(){
    const r = round(), fee = r.fee || state.settings.fee;
    let n = 0;
    ui.pendingPays.forEach(p=>{
      p.assigned.forEach(a=>{
        const e = r.entries.find(x=>x.id===a.id); if (!e) return;
        e.paid = true; e.paidAmount = fee; e.paidDate = p.row.date;
        e.paidRef = [p.row.description, p.row.notes].filter(Boolean).join(' · ');
        if (p.assigned.length>1 && p.assigned[0].id!==a.id) e.paidBy = p.assigned[0].name;
        n++;
      });
    });
