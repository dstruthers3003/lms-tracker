  },
  dropPays(){ ui.pendingPays=[]; render(); },
  togglePaid(el){
    const r = round(), e = r.entries.find(x=>x.id===el.dataset.id);
    e.paid = el.checked;
    if (e.paid){ e.paidAmount = r.fee || state.settings.fee; e.paidDate = e.paidDate || new Date().toISOString().slice(0,10); }
    else { e.paidAmount = 0; e.paidDate=''; e.paidRef=''; e.paidBy=''; }
    save(); render();
  },
  lockRound(){ round().locked = true; save(); render(); toast('Round locked. Good luck.'); },
  unlockRound(){ round().locked = false; save(); render(); },

  /* picks */
  setPickGw(el){ ui.pickGw = +el.value; ui.pendingPicks=[]; ui.settlePreview=null; render(); },
  clearChat(){ if($('#chatText')) $('#chatText').value=''; ui.chatText=''; ui.pendingPicks=[]; ui.unknownSenders=[]; if(ui.lastUpload&&ui.lastUpload.act==='uploadChat') ui.lastUpload=null; render(); },
  parseChat(){
    const r = round(), gw = ui.pickGw;
    const txt = ($('#chatText') && $('#chatText').value) || ui.chatText || '';
    if (!txt.trim()) return toast('Paste the chat export first.');
    ui.chatText = txt;
    ui.fromDate = $('#fromDate').value;
    const dl = deadlineOf(r, gw);
    let msgs = L.parseWhatsApp(txt, { dayFirst: state.settings.dayFirst });
    if (!msgs.length) return toast("That doesn't look like a WhatsApp export — check you exported 'without media'.");
    if (ui.fromDate){ const d = new Date(ui.fromDate); msgs = msgs.filter(m => m.date >= d); }
    if (!msgs.length) return toast('No messages after that point in the chat.');
    const cutoff = dl ? new Date(dl) : null;
    const raw = L.extractPicks(msgs, matchEntries(r));
    const picks = L.collapsePicks(raw);
    if (!picks.length) return toast('No team names found in those messages.');
    ui.pendingPicks = picks.map(p=>{
      const e = r.entries.find(x=>x.id===p.entryId);
      const flags = p.flags.slice();
      const late = cutoff && p.date > cutoff;
      if (late) flags.push('sent after the deadline (' + fmtDeadline(dl) + ')');
      if (e && L.isReuse(r, e.id, p.club, gw)) flags.push('already used ' + p.club + ' this round');
      if (e && e.status === 'out') flags.push('already knocked out');
      if (e && e.status === 'void') flags.push('removed from the round — never paid');
      const conf = flags.length > p.flags.length ? 'low' : p.confidence;
      return { ...p, late, flags, confidence: conf, use: conf !== 'low' && !!e && e.status === 'alive' };
    }).sort((a,b2)=>({low:0,medium:1,high:2}[a.confidence]-{low:0,medium:1,high:2}[b2.confidence]));
    const known = new Set(matchEntries(r).map(e=>e.id));
    const unknown = new Map();
    ui.pendingPicks.filter(p=>!p.entryId || !known.has(p.entryId)).forEach(p=>{
      if (!unknown.has(p.sender)) unknown.set(p.sender, { sender:p.sender, quote:p.quote, n:0 });
      unknown.get(p.sender).n++;
    });
    ui.unknownSenders = [...unknown.values()];
    const lateN = ui.pendingPicks.filter(p=>p.late).length;
    toast(`${picks.length} picks read from ${msgs.length} messages` + (lateN?` · ${lateN} after the deadline`:'') + '.');
    render();
  },
  pickUse(el){ ui.pendingPicks[+el.dataset.i].use = el.checked; render(); },
  pickEntry(el){ const p = ui.pendingPicks[+el.dataset.i]; p.entryId = el.value || null; if(!p.entryId) p.use=false; render(); },
  pickClub(el){ ui.pendingPicks[+el.dataset.i].club = el.value; render(); },
  applyPicks(){
    const r = round(), gw = ui.pickGw; let n=0;
    ui.pendingPicks.filter(p=>p.use && p.entryId).forEach(p=>{
      (r.picks[p.entryId] = r.picks[p.entryId] || {})[gw] = p.club; n++;
    });
    ui.pendingPicks = []; save(); render(); toast(n + ' picks saved to GW' + gw + '.');
  },
  dropPicks(){ ui.pendingPicks=[]; render(); },
  payFilter(el){ ui.payFilter = el.value; render(); },
  payUnpaidOnly(el){ ui.payUnpaidOnly = el.checked; render(); },
  wallFilter(el){ ui.wallFilter = el.value; render(); },
  wallAlive(el){ ui.wallAlive = el.checked; render(); },
  pickFilter(el){ ui.pickFilter = el.value; render(); },
  parseResultsPaste(){
    ui.resText = ($('#resText') && $('#resText').value) || ui.resText || '';
    if (!ui.resText.trim()) return toast('Paste the scores first.');
    ui.resParsed = L.parseResults(ui.resText);
    if (!ui.resParsed.games.length){ ui.resParsed = null; return toast("Couldn't find any scores in that."); }
    render();
  },
  clearResults(){ ui.resText=''; ui.resParsed=null; render(); },
  applyResults(){
    const r = round(), gw = ui.pickGw;
    const map = L.resultsMap(ui.resParsed.games);
    r.results[gw] = r.results[gw] || {};
    const inPlay = pickedClubs(r, gw);
    let n = 0;
    inPlay.forEach(c => { if (map[c]){ r.results[gw][c] = map[c]; n++; } });
    const missed = inPlay.filter(c => !map[c]);
    ui.resParsed = null; ui.resText='';
    save(); render();
    toast(n + ' results set' + (missed.length ? ' · still missing: ' + missed.join(', ') : '.'));
  },
  copyTally(){
    const r = round(), gw = ui.pickGw;
    const alive = aliveEntries(r);
    const tally = {};
    alive.forEach(e => { const c = (r.picks[e.id]||{})[gw]; if (c) tally[c] = (tally[c]||0)+1; });
    const rows = Object.entries(tally).sort((a,b)=>b[1]-a[1] || a[0].localeCompare(b[0]));
    const none = alive.length - rows.reduce((n,x)=>n+x[1],0);
    const txt = [`GW${gw} picks — ${alive.length} still in`, '']
      .concat(rows.map(([c,n]) => `${n} x ${c}`))
      .concat(none ? ['', `${none} still to pick`] : [])
      .concat(['', `Pot: ${money(pot(r))}`]).join('\n');
    navigator.clipboard?.writeText(txt).then(()=>toast('Tally copied.'), ()=>prompt('Copy this:', txt));
  },
  mapSender(el){
    const pid = el.value; if (!pid) return;
    const p = person(pid); const s = el.dataset.sender;
    if (p && !(p.aliases||[]).some(a=>L.norm(a)===L.norm(s))){
      p.aliases = (p.aliases||[]).concat(s);
      save(); toast(`"${s}" saved as ${p.name}. Re-reading the chat…`);
      if (ui.chatText){ $('#chatText') && ($('#chatText').value = ui.chatText); ACT.parseChat(); return; }
    }
    render();
  },
  setDeadline(el){
    const r = round(); r.deadlines = r.deadlines || {};
    if (el.value) r.deadlines[ui.pickGw] = el.value; else delete r.deadlines[ui.pickGw];
    save();
  },
  useSuggestion(el){
    const r = round(), id = el.dataset.id;
    (r.picks[id] = r.picks[id] || {})[ui.pickGw] = el.dataset.club;
    save(); render();
  },
  voidUnpaid(){
    const r = round();
    const list = r.entries.filter(e => e.status !== 'void' && !e.paid);
    if (!list.length) return;
    if (!confirm('Remove ' + list.map(entryName).join(', ') + ' from this round? They can be let back in afterwards.')) return;
    list.forEach(e => { e.status = 'void'; e.eliminatedGw = null; });
    save(); render(); toast(list.length + ' removed for non-payment.');
  },
  restoreEntry(el){
    const r = round(), e = r.entries.find(x=>x.id===el.dataset.id);
    e.status = 'alive'; save(); render(); toast(entryName(e) + ' is back in.');
  },
  setPick(el){
    const r = round(), gw = ui.pickGw, id = el.dataset.id;
    r.picks[id] = r.picks[id] || {};
    if (el.value) r.picks[id][gw] = el.value; else delete r.picks[id][gw];
    save(); render();
  },

  /* results */
  setResult(el){
    const r = round(), gw = ui.pickGw;
    r.results[gw] = r.results[gw] || {};
    const c = el.dataset.club;
    r.results[gw][c] = (r.results[gw][c] === el.dataset.v) ? undefined : el.dataset.v;
    if (!r.results[gw][c]) delete r.results[gw][c];
    save(); render();
  },
  previewSettle(){
    const r = round(), gw = ui.pickGw;
    ui.settlePreview = L.settleGameweek(r, gw, r.results[gw]||{}, {
      voidSurvives: state.settings.voidSurvives, availableClubs: seasonClubs(), requirePaid: true
    });
    render();
  },
  cancelSettle(){ ui.settlePreview=null; render(); },
  commitSettle(){
    const r = round(), s = ui.settlePreview, gw = s.gw;
    if (s.unresolved.length) return toast('Every live entry needs a pick before you can settle.');
    r.undo = JSON.parse(JSON.stringify({entries:r.entries, picks:r.picks, settled:r.settled,
      currentGw:r.currentGw, winners:r.winners, rolledOver:r.rolledOver}));
    s.eliminated.forEach(x=>{ const e = r.entries.find(y=>y.id===x.entry.id); e.status='out'; e.eliminatedGw=gw; });
    r.settled[gw] = true;
    const alive = aliveEntries(r);
    if (alive.length === 1){ r.winners = [alive[0].id]; r.rolledOver = false; toast(entryName(alive[0]) + ' wins ' + money(pot(r)) + '.'); }
    else if (alive.length === 0){ r.winners = []; r.rolledOver = true; toast('Everyone went out — ' + money(pot(r)) + ' rolls over to the next round.'); }
    else { r.currentGw = Math.max(r.currentGw, gw+1); ui.pickGw = r.currentGw; }
    ui.settlePreview = null; save(); render();
  },
  undo(){
    const r = round(); if (!r.undo) return;
    Object.assign(r, r.undo); r.undo = null; ui.pickGw = r.currentGw; save(); render(); toast('Settlement undone.');
  },

  /* wallchart */
  copySummary(){
    const t = summaryText(round());
    navigator.clipboard?.writeText(t).then(()=>toast('Copied — paste it straight into the group.'),
      ()=>{ prompt('Copy this:', t); });
  },
  exportCsv(){ download(round().name.replace(/\W+/g,'-').toLowerCase()+'.csv', csvText(round()), 'text/csv'); },

  /* settings */
  roundName(el){ round().name = el.value; save(); },
  roundFee(el){ round().fee = Number(el.value)||0; save(); },
  newRound(){
    const prev = round();
    const name = prompt('Name the new round:', 'Round ' + (state.rounds.length+1));
    if (!name) return;
    // remember how many lines everyone had — Greg's rule is you can't take more than last time
    state.people.forEach(p => {
      const n = prev.entries.filter(e => e.personId === p.id && e.status !== 'void').length;
      if (n) p.lastLines = n;
    });
    const r = newRound(name);
    const roll = prev && prev.rolledOver ? pot(prev) : 0;
    if (roll && confirm('Roll the ' + money(roll) + ' pot over into ' + name + '?')) r.carriedPot = roll;
    const bringOver = confirm('Bring the same ' + prev.entries.filter(e=>e.status!=='void').length +
      ' players over? (You can untick anyone sitting it out, and add newcomers, on the Players tab.)');
    if (bringOver){
      r.entries = prev.entries.filter(e=>e.status!=='void').map(e=>({id:uid(), personId:e.personId, paid:false,
        paidAmount:0, paidDate:'', paidRef:'', paidBy:'', status:'alive', eliminatedGw:null}));
    }
    state.rounds.push(r); state.activeRoundId = r.id; ui.pickGw = 1; ui.page = 'players';
    ui.pendingPicks=[]; ui.pendingPays=[]; ui.settlePreview=null;
    save(); render();
    toast('New round created' + (r.carriedPot?' with '+money(r.carriedPot)+' rolled in':'') + '. Sort the player list, then collect the money.');
  },
  delRound(){
    if (!confirm('Delete this round and everything in it?')) return;
    state.rounds = state.rounds.filter(x=>x.id!==state.activeRoundId);
    state.activeRoundId = state.rounds[0] ? state.rounds[0].id : null;
    save(); render();
  },
  setVoid(el){ state.settings.voidSurvives = el.checked; save(); },
  setDayFirst(el){ state.settings.dayFirst = el.checked; save(); },
  toggleClub(el){
    const sc = new Set(seasonClubs());
    el.checked ? sc.add(el.dataset.club) : sc.delete(el.dataset.club);
    state.settings.seasonClubs = [...sc];
    save(); render();
  },
  exportJson(){ download('lms-backup-'+new Date().toISOString().slice(0,10)+'.json', JSON.stringify(state,null,2), 'application/json'); },
  importJson(){ $('#fileIn').click(); },
  wipe(el){
    if (!armed(el)) return;
    state = blankState();
    clearLoaded();
    try { localStorage.removeItem(KEY); } catch(e){}
    ensureRound();
    ui.page = 'home';
    save(); render();
    toast('Everything erased — back to a blank tracker.');
  },
  demo(){ if (state.people.length && !confirm('Replace what you have with the demo data?')) return; loadDemo(); }
};

/* A button that arms itself on the first click. Browsers let people silence
   confirm() dialogs, and this app asks a lot of questions — after which every
   confirm silently returns false and nothing happens. */
function armed(el){
  const k = el.dataset.act;
  if (ui.armed === k){ ui.armed = null; clearTimeout(ui.armTimer); return true; }
  ui.armed = k;
  clearTimeout(ui.armTimer);
  ui.armTimer = setTimeout(() => { if (ui.armed === k){ ui.armed = null; render(); } }, 6000);
  render();
  return false;
}
function clearLoaded(){
  ui.chatText = ''; ui.monzoText = ''; ui.resText = ''; ui.resParsed = null;
  ui.setup = {}; ui.lastUpload = null; ui.fromWhen = ''; ui.toWhen = ''; ui.window = null; ui.spanWarning = null;
  ui.reviewIdx = 0; ui.listFilter = ''; ui.listUnpaid = false; ui.listNoPick = false;
  ui.pendingPicks = []; ui.pendingPays = []; ui.unknownSenders = []; ui.chatLoadedName = null;
  ['#chatText','#monzoText','#setupText','#resText'].forEach(s => { const e = $(s); if (e) e.value = ''; });
}

/* ---------- event wiring ---------- */
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]');
  if (!el || el.tagName === 'SELECT' || el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') return;
  const fn = ACT[el.dataset.act]; if (fn){ e.preventDefault(); fn(el); }
});
document.addEventListener('change', e=>{
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const filters = ['payFilter','wallFilter','pickFilter','setupFilter','listFilter','rvName'];
  if (el.tagName === 'SELECT' || el.type === 'checkbox' || el.type === 'file' || el.type === 'number'
      || el.type === 'datetime-local' || filters.includes(el.dataset.act)){
    const fn = ACT[el.dataset.act]; if (fn) fn(el);
  }
});
document.addEventListener('input', e=>{
  const el = e.target.closest('[data-act]');
  if (!el || el.tagName !== 'INPUT' || el.type === 'checkbox') return;
  if (['editPerson','roundName','roundFee','suName','rvName'].includes(el.dataset.act)) ACT[el.dataset.act](el);
});

function renderSetup(r){

  $('#p-setup').innerHTML = `
  <div class="hd"><h1>Set up ${esc(r.name)}</h1><span class="mini">${r.entries.length} entries so far</span></div>
  <p class="hint">Paste the thread that starts with the announcement. One pass pulls out who's playing, how many lines
  they've taken, whether they've paid and their first pick — including the people who type their real name in the message
  but show up in WhatsApp as "~ Paddy". Everything is a proposal until you press the button at the bottom.</p>

  <div class="card"><h3>1 · Settings for this import</h3>
    <div class="row">
      <div class="field" style="max-width:150px"><label class="f" for="suFee">Entry fee £</label>
        <input type="number" id="suFee" value="${r.fee||11}" min="1" step="1"></div>

ACT.parseSetup = function(){
  const r = round();
  const s = ui.setup = ui.setup || {};
  s.text = ($('#setupText') && $('#setupText').value) || s.text || '';
  s.organiser = ($('#suOrg') ? $('#suOrg').value : s.organiser || '').trim();
  s.from = $('#suFrom') ? $('#suFrom').value : (s.from || '');
  const fee = Number($('#suFee') ? $('#suFee').value : 0) || r.fee || 11;
  r.fee = fee;
  if (!s.text.trim()) return toast('Paste the chat export first.');
  let msgs = L.parseWhatsApp(s.text, { dayFirst: state.settings.dayFirst });
  if (!msgs.length) return toast("That doesn't look like a WhatsApp export.");
  if (s.from){ const d = new Date(s.from); msgs = msgs.filter(m => m.date >= d); }
  if (!msgs.length) return toast('No messages after that point.');
  const found = L.buildEntrants(msgs, { fee, organiser: s.organiser });
  if (!found.length) return toast('Nobody in those messages looked like an entrant.');
  const order = { low:0, medium:1, high:2 };
  const roster = state.people.map(p => ({ id:p.id, name:p.name, aliases:p.aliases||[] }));
  s.rows = found.map(x => {
    // exact hit: same name, or a WhatsApp name we've already learned
    const p = state.people.find(q => L.norm(q.name) === L.norm(x.name)
              || (q.aliases||[]).some(al => L.norm(al) === L.norm(x.sender)));
    const cap = p && p.lastLines ? p.lastLines : null;
    const row = { ...x, include:true, cap, personId: p ? p.id : null,
                  isNew: !p, linkTo:'', near:[] };
    if (cap && x.lines > cap){
      row.flags = row.flags.concat('taking ' + x.lines + ' lines but only had ' + cap + ' last round');
      row.confidence = 'low';
      row.overCap = true;
    }
    if (p && L.norm(p.name) !== L.norm(x.name)) row.name = p.name;   // use the name already on file

    // no exact hit — is this a newcomer, or a name I've read slightly wrong?
    if (!p && roster.length){
      const seen = new Set();
      const near = [];
      [x.name, x.sender].forEach(probe => {
        const m = L.matchPerson(probe, roster);
        if (m && m.score >= 0.7 && !seen.has(m.entry.id)){ seen.add(m.entry.id); near.push({ id:m.entry.id, name:m.entry.name, score:m.score, how:m.how }); }
      });
      // also catch a transposed or half-typed surname
      L.nameCandidates(x.name).filter(c => c.words >= 2).forEach(c => {
        const m = L.matchPerson(c.name, roster);
        if (m && m.score >= 0.75 && !seen.has(m.entry.id)){ seen.add(m.entry.id); near.push({ id:m.entry.id, name:m.entry.name, score:m.score, how:m.how }); }
      });
      near.sort((a,b)=>b.score-a.score);
      row.near = near.slice(0,3);
      if (row.near.length){
        row.flags = row.flags.concat('new name, but close to ' + row.near.map(n=>n.name).join(' / '));
        row.confidence = 'low';
        row.maybeDupe = true;
      }
    }
    return row;
  }).sort((a,b)=>order[a.confidence]-order[b.confidence]);
  const over = s.rows.filter(x=>x.overCap).length;
  const dupe = s.rows.filter(x=>x.maybeDupe).length;
  if (over) setTimeout(()=>toast(over + ' taking more lines than last round — top of the list.'), 900);
  if (dupe) setTimeout(()=>toast(dupe + ' new name' + (dupe===1?'':'s') + ' close to someone already on the list — check before creating.'), 1600);
  toast(`${found.length} entrants, ${found.reduce((n,x)=>n+x.lines,0)} lines, from ${msgs.length} messages.`);
  render();
};

ACT.applySetup = function(){
  const r = round(), fee = r.fee || 11;
  let people = 0, lines = 0, picks = 0;
  ui.setup.rows.filter(x=>x.include).forEach(x=>{
    let p = (x.linkTo || x.personId) ? person(x.linkTo || x.personId) : null;
    if (!p) p = state.people.find(q => L.norm(q.name) === L.norm(x.name));
    if (!p){ p = { id:uid(), name:x.name, aliases:[] }; state.people.push(p); people++; }
    if (x.sender && L.norm(x.sender) !== L.norm(p.name) && !(p.aliases||[]).some(a=>L.norm(a)===L.norm(x.sender))){
      p.aliases = (p.aliases||[]).concat(x.sender);   // learn the WhatsApp name for next week
    }
    const existing = entriesForPerson(r, p.id);
    for (let n = 1; n <= x.lines; n++){
      let e = existing.find(q => (q.line||1) === n);
      if (!e){
        e = { id:uid(), personId:p.id, line:n, of:x.lines, paid:false, paidAmount:0, paidDate:'',
              paidRef:'', paidBy:'', status:'alive', eliminatedGw:null };
        r.entries.push(e); lines++;
      }
      e.of = x.lines;
      if (x.paid){ e.paid = true; e.paidAmount = fee; e.paidDate = e.paidDate || new Date().toISOString().slice(0,10);
                   e.paidRef = e.paidRef || 'said paid in the group'; }
      if (x.picks[n]){ (r.picks[e.id] = r.picks[e.id] || {})[1] = x.picks[n]; picks++; }
    }
    entriesForPerson(r, p.id).forEach(e => e.of = Math.max(e.of||1, x.lines));
  });
  ui.setup = {};
  save(); render();
  toast(`${lines} entries created · ${people} player${people===1?'':'s'} new to the game · ${picks} picks logged.`);
};

/* ============================================================
   FILE UPLOADS — drop a WhatsApp .zip/.txt or a Monzo .csv
   ============================================================ */

/** Pull a named entry out of a zip without any libraries. */
async function unzipText(buf, prefer){
  const dv = new DataView(buf);
  let eocd = -1;
  for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 65557); i--){
    if (dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if (eocd < 0) throw new Error('That zip looks damaged.');
  const count = dv.getUint16(eocd + 10, true);
  let off = dv.getUint32(eocd + 16, true);
  const files = [];
  for (let i = 0; i < count; i++){
    if (dv.getUint32(off, true) !== 0x02014b50) break;
    const method = dv.getUint16(off + 10, true);
    let csize    = dv.getUint32(off + 20, true);
    const usize  = dv.getUint32(off + 24, true);
    const nlen   = dv.getUint16(off + 28, true);
    const elen   = dv.getUint16(off + 30, true);
    const clen   = dv.getUint16(off + 32, true);
    const lho    = dv.getUint32(off + 42, true);
    const name   = new TextDecoder().decode(new Uint8Array(buf, off + 46, nlen));
    files.push({ name, method, csize, usize, lho });
    off += 46 + nlen + elen + clen;
  }
  if (!files.length) throw new Error('Nothing inside that zip.');
  const target = files.find(f => prefer.test(f.name)) || files.find(f => /\.txt$/i.test(f.name)) || files[0];
  const ln = dv.getUint16(target.lho + 26, true);
  const le = dv.getUint16(target.lho + 28, true);
  const start = target.lho + 30 + ln + le;
  const size = target.csize || (buf.byteLength - start);
  const data = new Uint8Array(buf, start, size);
  if (target.method === 0) return new TextDecoder('utf-8').decode(data);
  if (typeof DecompressionStream === 'undefined')
    throw new Error("This browser can't open zips — unzip it first and drop the _chat.txt in.");
  const stream = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return await new Response(stream).text();
}

/** Read whatever they dropped and hand back plain text. */
async function readDropped(file){
  const name = (file.name || '').toLowerCase();
  if (name.endsWith('.zip')){
    const buf = await file.arrayBuffer();
    return await unzipText(buf, /_chat\.txt$/i);
  }
  return await file.text();
}

const UPLOADS = {
  uploadSetup: { accept:'.txt,.zip', field:'#setupText', store:s=>{ (ui.setup=ui.setup||{}).text=s; }, then:'parseSetup',
                 note:'chat export' },
  uploadChat:  { accept:'.txt,.zip', field:'#chatText',  store:s=>{ ui.chatText=s; },                then:'parseChat',
                 note:'chat export' },
  uploadMonzo: { accept:'.csv,.txt', field:'#monzoText', store:s=>{ ui.monzoText=s; },               then:'parseMonzo',
                 note:'Monzo CSV' },
  uploadRes:   { accept:'.csv,.txt', field:'#resText',   store:s=>{ ui.resText=s; },                 then:'parseResultsPaste',
                 note:'results' }
};

async function handleUpload(act, file){
  const cfg = UPLOADS[act];
  if (!file || !cfg) return;
  const big = file.size > 12 * 1024 * 1024;
  toast('Reading ' + file.name + (big ? ' — big file, give it a second…' : '…'));
  try {
    const text = await readDropped(file);
    if (!text || !text.trim()) return toast(file.name + ' came out empty.');
    cfg.store(text);
    ui.lastUpload = { act, name:file.name, chars:text.length };
    render();
    const el = $(cfg.field);
    // never leave stale pasted text behind, and don't push 3MB into the DOM
    if (el) el.value = text.length <= 200000 ? text : '';
    ACT[cfg.then]();
  } catch (err){
    toast(err.message || "Couldn't read that file.");
  }
}

}

/* drag and drop anywhere on a zone */
document.addEventListener('dragover', e => {
  const z = e.target.closest && e.target.closest('.drop');
  if (!z) return;
  e.preventDefault(); z.classList.add('over');
});
document.addEventListener('dragleave', e => {
  const z = e.target.closest && e.target.closest('.drop');
  if (z) z.classList.remove('over');
});
document.addEventListener('drop', e => {
  const z = e.target.closest && e.target.closest('.drop');
  if (!z) return;
  e.preventDefault(); z.classList.remove('over');
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) handleUpload(z.dataset.drop, f);
});

  <div class="two-up" style="margin-top:20px">
    <div class="card"><h3>1 · The WhatsApp chat</h3>
      ${dropZone('uploadChatHome','Drop the chat export here')}
      ${boxNote(ui.chatText)}
      <details class="paste"><summary>or paste it instead</summary>
        <textarea id="chatText" placeholder="[10/08/2026, 19:55:01] Greg Chamberlain: New Last Man Standing…">${esc(boxText(ui.chatText))}</textarea>
      </details>
    </div>
    <div class="card"><h3>2 · The bank statement <span class="mini">optional</span></h3>
      ${dropZone('uploadMonzo','Drop the CSV here')}
      ${boxNote(ui.monzoText)}
      <details class="paste"><summary>or paste it instead</summary>
        <textarea id="monzoText" placeholder="Transaction ID,Date,Time,Type,Name,…">${esc(boxText(ui.monzoText))}</textarea>
      </details>
      <p class="hint">Without this I'll go on who said they'd paid in the group.</p>
    </div>
  </div>

  <div class="card" style="margin-top:16px"><h3>3 · Settings</h3>
    <div class="row">
      <div class="field" style="max-width:130px"><label class="f" for="suFee">Entry fee £</label>
        <input type="number" id="suFee" value="${r.fee||11}" min="1" step="1"></div>
      <div class="field" style="max-width:230px"><label class="f" for="suOrg">Organiser</label>
        <input type="text" id="suOrg" value="${esc(ui.organiser!==undefined?ui.organiser:'Greg Chamberlain')}"></div>
    </div>
    <div class="row dates" style="margin-top:12px;align-items:flex-end">
      <div class="field" style="max-width:240px"><label class="f" for="suFrom">Read the chat from</label>
        <input type="datetime-local" id="suFrom" value="${esc(ui.fromWhen||'')}"></div>
      <div class="field" style="max-width:240px"><label class="f" for="suTo">up to and including</label>
        <input type="datetime-local" id="suTo" value="${esc(ui.toWhen||'')}"></div>
      <div class="field" style="max-width:240px"><label class="f" for="suDeadline">Picks deadline (for late flags)</label>
        <input type="datetime-local" id="suDeadline" value="${esc(deadlineOf(r,1)||'')}"></div>
      <div><button class="btn ghost" data-act="autoRange">Work it out from the chat</button></div>
    </div>
    <p class="hint">The range is the <strong>sign-up window only</strong>: from Greg's announcement to the entry deadline.
    It needs an end as well as a start — once the round is running, the weekly picks that follow would otherwise be read
    as part of the entry list, and eight weeks of someone's messages become one enormous entry.</p>
    ${ui.window ? `<p class="hint" style="color:var(--ink-2)">Last read: <strong>${esc(fmtDeadline(ui.window.from))}</strong>
      ${ui.window.to?`to <strong>${esc(fmtDeadline(ui.window.to))}</strong>`:''} — ${ui.window.kept.toLocaleString()} messages${
      ui.window.ignored?`, ignoring ${ui.window.ignored.toLocaleString()} sent after the deadline`:''}
      ${ui.window.reason?`<br><span class="mini">(${esc(ui.window.reason)})</span>`:''}</p>`:''}
  </div>

  ${ui.spanWarning ? `<div class="card" style="margin-top:16px;border-left:3px solid var(--out)">
    <h3>That's the whole chat, not one round</h3>
    <p style="margin:0 0 10px">The file covers <strong>${ui.spanWarning.days} days</strong> and ${ui.spanWarning.msgs.toLocaleString()} messages.
    Read that as one round and people's years of chat get piled into a single entry — someone who's been in the group since 2018
    comes out with twenty lines.</p>
    ${ui.spanWarning.suggest ? `<p style="margin:0 0 12px">This game was announced on <strong>${esc(ui.spanWarning.when)}</strong>.</p>
      <button class="btn" data-act="useAnnouncement" data-when="${esc(ui.spanWarning.suggest)}">Read from there instead</button>`
      : `<p class="hint" style="margin:0">Set "start reading from" to the moment the new game was announced.</p>`}
  </div>`:''}

  <div class="row" style="margin-top:20px">
    <button class="btn bigbtn" data-act="buildAll">${ui.armed==='buildAll'?'Tap again — this replaces the list':(built?'Rebuild the list':'Build the list')}</button>
    ${built?`<button class="btn ghost" data-act="wipe">${ui.armed==='wipe'?'Tap again to confirm':'Start again from scratch'}</button>`:''}
    ${built?`<span class="mini">${lines} lines · ${paid} paid · ${left} left to check</span>`:''}
  </div>

  ${built && r.bankSummary && r.bankSummary.outside ? `<div class="card" style="margin-top:16px;border-left:3px solid var(--review)">
    <h3>${r.bankSummary.outside} payments fall outside your range</h3>
    <p style="margin:0 0 10px">Worth ${money((r.bankSummary.lateDays||[]).reduce((n,d)=>n+d.total,0))} in total:</p>
    <div class="tw" style="max-width:420px"><table><tbody>
      ${(r.bankSummary.lateDays||[]).slice(0,8).map(d=>`<tr><td class="mini">${esc(d.date)}</td>
        <td class="num">${d.n} payment${d.n===1?'':'s'}</td><td class="num">${money(d.total)}</td>
        <td class="mini">${Math.round(d.total/(r.fee||11))} lines</td></tr>`).join('')}
    </tbody></table></div>
    ${r.bankSummary.nextDay ? `<div class="row" style="margin-top:12px">
      <button class="btn" data-act="extendTo" data-when="${esc(r.bankSummary.nextDay.date)}">Include ${esc(r.bankSummary.nextDay.date)} and rebuild</button>
      <span class="mini">Money that arrived just after the deadline is usually still in.</span></div>`:''}
  </div>`:''}

  ${built ? `<div class="card" style="margin-top:20px;border-left:3px solid ${left?'var(--review)':'var(--through)'}">
    <h3>${left ? left + ' need checking' : 'All checked'}</h3>
    <p style="margin:0 0 12px">${lines} lines from ${new Set(r.entries.map(e=>e.personId)).size} people · ${money(paid*(r.fee||11))} in ·
      ${r.entries.filter(e=>!e.paid).length} still owing</p>
    ${r.bankCoverage && r.bankCoverage.matched / Math.max(1,r.bankCoverage.of) < 0.3 ? `<p class="hint">
      The statement only matched ${r.bankCoverage.matched} of ${r.bankCoverage.of} people (${r.bankCoverage.credits} credits in the file),
      so I've gone on who said they'd paid in the group. Drop in a fuller statement and rebuild to check the money properly.</p>`:''}
    <div class="row">
      ${left?`<button class="btn" data-act="go" data-page="review">Work through the ${left}</button>`:''}
      <button class="btn ghost" data-act="go" data-page="list">See the full list</button>
    </div></div>`:''}`;
}

/* ---------- building ---------- */
ACT.uploadChatHome = function(el){ handleUpload('uploadChatHome', el.files && el.files[0]); };
UPLOADS.uploadChatHome = { accept:'.txt,.zip', field:'#chatText', store:s=>{
  ui.chatText = s;
  try {
    const ms = L.parseWhatsApp(s, { dayFirst: state.settings.dayFirst });
    const a = L.findAnnouncement(ms, ui.organiser !== undefined ? ui.organiser : 'Greg Chamberlain');
    if (a){
      const toLocal = d => new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,16);
      ui.fromWhen = toLocal(a.date);
      ui.toWhen = toLocal(new Date(a.date.getTime() + 10*86400000));   // sign-up window, not the whole round
    }
  } catch(e){}
}, then:'noop', note:'chat export' };
ACT.noop = function(){};
/** Fill the range in from the chat itself: announcement → entry deadline. */
ACT.autoRange = function(){
  ui.chatText = ($('#chatText') && $('#chatText').value) || ui.chatText || '';
  if (!ui.chatText.trim()) return toast('Drop the chat in first and I can work the range out.');
  ui.organiser = ($('#suOrg') ? $('#suOrg').value : ui.organiser || '').trim();
  const msgs = L.parseWhatsApp(ui.chatText, { dayFirst: state.settings.dayFirst });
  if (!msgs.length) return toast("That doesn't look like a WhatsApp export.");
  const ann = L.findAnnouncement(msgs, ui.organiser);
  if (!ann) return toast("I can't find a 'new Last Man Standing' post — set the range by hand.");
  const toLocal = d => new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,16);
  ui.fromWhen = toLocal(ann.date);
  const dlField = $('#suDeadline') ? $('#suDeadline').value : '';
  const end = dlField ? new Date(new Date(dlField).getTime() + 12*3600000)
                      : new Date(ann.date.getTime() + 10*86400000);
  ui.toWhen = toLocal(end);
  const inRange = msgs.filter(m => m.date >= ann.date && m.date <= end).length;
  render();
  toast(`${fmtDeadline(ui.fromWhen)} to ${fmtDeadline(ui.toWhen)} — ${inRange.toLocaleString()} messages, ` +
        `${(msgs.length - inRange).toLocaleString()} left out.`);
};

ACT.extendTo = function(el){
  const m = /(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})/.exec(el.dataset.when || '');
  if (!m) return toast("I can't read that date.");
  const yy = +m[3], d = new Date(yy < 100 ? 2000+yy : yy, +m[2]-1, +m[1], 23, 59);
  ui.toWhen = new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,16);
  ui.page = 'home'; render();
  const f = $('#suTo'); if (f) f.value = ui.toWhen;
  ui.armed = null; ui.forceBuild = true;
  ACT.buildAll();
};

ACT.useAnnouncement = function(el){
  ui.fromWhen = el.dataset.when; ui.spanWarning = null;
  render();
  const f = $('#suFrom'); if (f) f.value = ui.fromWhen;   // the field is rebuilt by render, keep them in step
  ui.forceBuild = true;
  ACT.buildAll();
};
ACT.toggleMore = function(){ ui.showMore = !ui.showMore; render(); };

ACT.buildAll = function(){
  const r = round();
  ui.chatText  = ($('#chatText')  && $('#chatText').value)  || ui.chatText  || '';
  ui.monzoText = ($('#monzoText') && $('#monzoText').value) || ui.monzoText || '';
  ui.organiser = ($('#suOrg') ? $('#suOrg').value : ui.organiser || '').trim();
  const fromField = $('#suFrom') ? $('#suFrom').value : '';
  ui.fromWhen = fromField || ui.fromWhen || '';
  const toField = $('#suTo') ? $('#suTo').value : '';
  ui.toWhen = toField || ui.toWhen || '';
  const fee = Number($('#suFee') ? $('#suFee').value : 0) || r.fee || 11;
  const dl  = $('#suDeadline') ? $('#suDeadline').value : '';
  if (!ui.chatText.trim()) return toast('Drop the WhatsApp export in first.');
  if (ui.forceBuild){ ui.forceBuild = false; ui.armed = null; }
  else if (r.entries.length && !armed({ dataset:{ act:'buildAll' } })) return;

  r.fee = fee;
  if (dl){ r.deadlines = r.deadlines || {}; r.deadlines[1] = dl; }
  r.entries = []; r.picks = {}; r.review = [];

  let msgs = L.parseWhatsApp(ui.chatText, { dayFirst: state.settings.dayFirst });
  if (!msgs.length) return toast("That doesn't look like a WhatsApp export.");

  const ann = L.findAnnouncement(msgs, ui.organiser);
  const toLocal = d => new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,16);
  if (!ui.fromWhen && ann){
    ui.fromWhen = toLocal(ann.date);
    toast('Reading from ' + fmtDeadline(ui.fromWhen) + ' — where this game was announced.');
  }
  if (ui.fromWhen){ const d = new Date(ui.fromWhen); msgs = msgs.filter(m => m.date >= d); }
  if (!msgs.length) return toast('No messages after that point in the chat.');

  // Stop at the entry deadline. Once the round is running the chat fills up with weekly
  // picks, and reading those as part of the sign-up lumps eight weeks of messages into
  // each person's entry — everyone ends up with inflated lines and nothing is certain.
  const beforeCut = msgs.length;
  let cutoff = null, cutReason = '';
  if (ui.toWhen){
    cutoff = new Date(ui.toWhen);
    cutReason = 'the range you set';
  } else if (dl){
    cutoff = new Date(new Date(dl).getTime() + 12*3600000);   // a few hours' grace for stragglers
    cutReason = 'your picks deadline, plus a few hours for stragglers';
  } else if (ann){
    cutoff = new Date(ann.date.getTime() + 10*86400000);
    cutReason = '10 days after the announcement, as a fallback';
  }
  if (cutoff) msgs = msgs.filter(m => m.date <= cutoff);
  const ignored = beforeCut - msgs.length;
  if (!msgs.length) return toast('No messages between the announcement and that deadline.');
  ui.window = { from: ui.fromWhen, to: cutoff ? toLocal(cutoff) : '', kept: msgs.length, ignored, reason: cutReason };

  // A round is weeks, not years. If we're about to read an archive, stop and say so.
  const spanDays = (msgs[msgs.length-1].date - msgs[0].date) / 86400000;
  if (spanDays > 70){
    ui.spanWarning = {
      days: Math.round(spanDays), msgs: msgs.length,
      suggest: ann ? toLocal(ann.date) : '',
      when: ann ? fmtDeadline(toLocal(ann.date)) : ''
    };
    ui.page = 'home';                 // show the reason next to the button that failed
    render();
    return toast("That's " + Math.round(spanDays) + " days of chat — too much for one round.");
  }
  ui.spanWarning = null;

  const found = L.buildEntrants(msgs, { fee, organiser: ui.organiser });
  if (!found.length) return toast('Nobody in those messages looked like an entrant.');

  const review = [];

  /* ---------- 1. the bank decides who is in ----------
     Plenty of people pay Greg and never post, so the statement is the membership
     list. Each credit becomes that many lines, and the chat then says who they are
     and what they picked. */
  /* "Andrew Newman" beats "A Newman" beats "NEWMAN A". Greg's sheet uses real names,
     so when the chat and the bank describe the same person, keep the readable one. */
  const nameScore = nm => {
    const w = String(nm||'').trim().split(/\s+/);
    if (!w.length || !w[0]) return -1;
    let s = 0;
    if (w.length >= 2) s += 40;
    if (w.every(x => x.length >= 3)) s += 30;            // no initials
    if (/[a-z]/.test(nm) && /[A-Z]/.test(nm)) s += 15;   // not a block-capital bank name
    if (!/^unnamed/i.test(nm)) s += 10;
    return s + Math.min(10, nm.length / 4);
  };
  const preferName = (p, nm) => {
    if (!nm || !p) return;
    if (nameScore(nm) > nameScore(p.name)){
      if (!(p.aliases||[]).some(a => L.norm(a) === L.norm(p.name))) p.aliases = (p.aliases||[]).concat(p.name);
      p.name = nm;
    } else if (!(p.aliases||[]).some(a => L.norm(a) === L.norm(nm))){
      p.aliases = (p.aliases||[]).concat(nm);
    }
  };
  const findPerson = nm => state.people.find(q => L.norm(q.name) === L.norm(nm)
                        || (q.aliases||[]).some(al => L.norm(al) === L.norm(nm)));
  const tidyName = nm => String(nm||'').replace(/^[^A-Za-z(]+/,'').replace(/\s+/g,' ').trim() || String(nm||'').trim();
  const makePerson = nm => { const p = { id:uid(), name:tidyName(nm), aliases:[] }; state.people.push(p); return p; };
  const addEntry = (pid, extra) => {
    const e = Object.assign({ id:uid(), personId:pid, line:1, of:1, paid:false, saidPaid:false, bankPaid:false,
      paidAmount:0, paidDate:'', paidRef:'', paidBy:'', status:'alive', eliminatedGw:null }, extra||{});
    r.entries.push(e); return e;
  };
  const renumber = pid => {
    const own = r.entries.filter(e => e.personId === pid);
    own.forEach((e,i) => { e.line = i+1; e.of = own.length; });
  };

  const bankPeople = [];                 // {person, entries, row}
  if (ui.monzoText.trim()){
    const parsed = L.parseMonzoCSV(ui.monzoText);
    const toDate = s => {
      const m = /(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})/.exec(String(s||''));
      if (!m) return null;
      const yy = +m[3]; return new Date(yy < 100 ? 2000+yy : yy, +m[2]-1, +m[1]);
    };
    const from = ui.fromWhen ? new Date(ui.fromWhen) : null;
    const to   = cutoff;
    let outside = 0, odd = 0;
    const late = {};
    parsed.rows.forEach(row => {
      if (row.amount <= 0) return;
      const d = toDate(row.date);
      if (d && ((from && d < new Date(from.getFullYear(), from.getMonth(), from.getDate())) || (to && d > to))){
        outside++;
        const k = row.date || '?';
        late[k] = late[k] || { n:0, total:0, when:d };
        late[k].n++; late[k].total += row.amount;
        return;
      }
      const units = row.amount / fee;
      let whole = Math.abs(units - Math.round(units)) < 0.001 ? Math.round(units) : null;
      const ref = [row.description, row.notes].filter(Boolean).join(' · ');
      let shortBy = 0;
      if (!whole || whole < 1 || whole > 20){
        const guess = Math.max(1, Math.min(20, Math.round(units)));
        shortBy = guess * fee - row.amount;
        odd++;
        if (Math.abs(shortBy) > fee * 0.5 || guess < 1){
          review.push({ id:uid(), kind:'payment', row:{date:row.date, name:row.name, amount:row.amount, detail:ref},
            suggested: [], flags:['£' + row.amount + " doesn't look like any number of £" + fee + ' entries'], done:false });
          return;
        }
        whole = guess;          // £10 for a £11 entry — they're in, they're just short
      }
      const nm = payerName(row.name, ref) || row.name;
      let p = findPerson(nm);
      if (!p){ p = makePerson(nm); }
      if (row.name && L.norm(row.name) !== L.norm(p.name) && !(p.aliases||[]).some(al => L.norm(al) === L.norm(row.name)))
        p.aliases = (p.aliases||[]).concat(row.name);
      p.quote = row.name + '  ' + money(row.amount) + (ref ? '  ref: ' + ref : '');
      const made = [];
      for (let n = 1; n <= whole; n++){
        made.push(addEntry(p.id, { paid:true, bankPaid:true, paidAmount:fee, paidDate:row.date, paidRef:row.name,
                                   shortBy: shortBy ? Math.round(shortBy*100)/100 : 0 }));
      }
      renumber(p.id);
      bankPeople.push({ person:p, entries:made, shortBy,
        row:{date:row.date, name:row.name, amount:row.amount, detail:ref} });
      if (shortBy > 0) review.push({ id:uid(), kind:'payment', row:{date:row.date, name:row.name, amount:row.amount, detail:ref},
        suggested: made.map(e=>e.id),
        flags:['£' + row.amount + ' for ' + whole + ' line' + (whole===1?'':'s') + ' — ' + money(shortBy) + ' short'], done:false });
    });
    const lateDays = Object.keys(late).map(k => ({ date:k, n:late[k].n, total:late[k].total, when:late[k].when }))
                       .sort((a,b) => a.when - b.when);
    r.bankSummary = { credits: parsed.rows.filter(z=>z.amount>0).length, used: bankPeople.length, outside, odd,
                      lines: r.entries.length, lateDays,
                      nextDay: lateDays.length ? lateDays[0] : null };
  }

  /* ---------- 2. the chat says who they are and what they picked ---------- */
  const claimedBy = new Set();
  found.forEach(x => {
    const probes = [x.name, x.sender].concat((x.members||[]).map(m => m.name));
    let p = null;
    for (const probe of probes){ p = findPerson(probe); if (p) break; }
    if (!p && bankPeople.length){
      const roster = state.people.map(q => ({ id:q.id, name:q.name, aliases:q.aliases||[] }));
      const hit = L.matchPerson(x.name, roster);
      if (hit && hit.score >= 0.85) p = state.people.find(q => q.id === hit.entry.id);
    }
    const fromBank = !!p && r.entries.some(e => e.personId === p.id && e.bankPaid);
    if (!p) p = makePerson(x.name);
    else preferName(p, x.name);          // the chat usually has the name Greg would write
    if (x.sender && L.norm(x.sender) !== L.norm(p.name) && !(p.aliases||[]).some(al => L.norm(al) === L.norm(x.sender)))
      p.aliases = (p.aliases||[]).concat(x.sender);
    if (!p.quote || !fromBank) p.quote = x.quote;
    p.sender = x.sender;
    claimedBy.add(p.id);

    // lines the bank already paid for under this payer
    let slots = r.entries.filter(e => e.personId === p.id && e.bankPaid);
    const mems = (x.members && x.members.length) ? x.members : null;
    const want = Math.max(x.lines, mems ? mems.length : 0);
    const ids = [];

    for (let n = 1; n <= want; n++){
      const mem = mems ? mems[n-1] : null;
      let e = slots[n-1];
      if (!e){
        e = addEntry(p.id, { paid: !!x.paid, saidPaid: !!x.paid, paidAmount: x.paid ? fee : 0,
                             paidRef: x.paid ? 'said paid in the group' : '' });
      } else if (x.paid){ e.saidPaid = true; }
      // a named friend takes the line under their own name, with the payer recorded
      if (mem && L.norm(mem.name) !== L.norm(p.name)){
        let owner = findPerson(mem.name) || makePerson(mem.name);
        if (owner.id !== p.id){ e.personId = owner.id; e.paidBy = p.name; renumber(owner.id); }
      }
      ids.push(e.id);
      // a member with no team of their own still takes the team found elsewhere
      // in the message ("Alan ward / Arsenal / Paid")
      const team = (mem && mem.team) ? mem.team : x.picks[n];
      if (team) (r.picks[e.id] = r.picks[e.id] || {})[1] = team;
    }
    renumber(p.id);
    if (slots.length > want) flagsPush(review, p, slots.length, want, x);

    let near = [];
    if (!fromBank && state.people.length > 1){
      const roster = state.people.filter(q => q.id !== p.id).map(q=>({id:q.id,name:q.name,aliases:q.aliases||[]}));
      [x.name, x.sender].forEach(probe => {
        const m = L.matchPerson(probe, roster);
        if (m && m.score >= 0.8 && !near.some(z=>z.id===m.entry.id)) near.push({id:m.entry.id, name:m.entry.name});
      });
    }
    const unpaid = !fromBank && !x.paid;
    if (x.confidence !== 'high' || near.length || unpaid){
      review.push({ id:uid(), kind:'entrant', personId:p.id, entryIds:ids, sender:x.sender,
        flags: x.flags
          .concat(near.length ? ['new name, close to ' + near.map(z=>z.name).join(' / ')] : [])
          .concat(!fromBank ? [x.paid ? 'said paid in the group, nothing in the statement' : 'no payment found for them'] : []),
        quote:x.quote, confidence: (near.length || unpaid) ? 'low' : x.confidence,
        done:false, second: !near.length && !unpaid && x.confidence === 'medium' });
    }
  });

  /* ---------- 3a. said paid, but the statement doesn't show it ---------- */
  (function(){
    if (!ui.monzoText.trim()) return;
    const byPerson = {};
    r.entries.forEach(e => { (byPerson[e.personId] = byPerson[e.personId] || []).push(e); });
    Object.keys(byPerson).forEach(pid => {
      const set = byPerson[pid];
      if (set.some(e => e.saidPaid) && !set.some(e => e.bankPaid))
        review.push({ id:uid(), kind:'unsure', personId:pid, entryIds:set.map(e=>e.id), done:false });
    });
  })();

  /* ---------- 3. paid, but never said a word ----------
     These aren't decisions, they're a chase list, so they live as a filter on the
     list rather than as a card each. Same for lines with no team. */
  r.silent = bankPeople.filter(bp => !claimedBy.has(bp.person.id)).map(bp => bp.person.id);

  // lines with no team are a chase list, not a queue of judgements

  const order = { entrant:0, payment:1, unsure:2, frombank:3, pick:4 };
  review.forEach(x => { if (x.second) x.done = true; });     // parked, not gone
  r.review = review.sort((a,b)=>(order[a.kind]-order[b.kind]) ||
    ({low:0,medium:1,high:2}[a.confidence||'high'] - {low:0,medium:1,high:2}[b.confidence||'high']));
  ui.reviewIdx = 0; ui.page = 'list';     // see the reconciliation first, then work the doubts
  save(); render();
  toast(`${r.entries.length} lines from ${found.length} people · ${r.review.filter(x=>!x.done).length} to check`
    + (ignored ? ` · ignored ${ignored.toLocaleString()} messages sent after the deadline.` : '.'));
};

/** Best readable name from a bank row: the reference often carries it, not the account. */
function payerName(title, ref){
  const clip = s => String(s||'').replace(/^[^A-Za-z]+/,'').replace(/[^A-Za-z)]+$/,'');
  title = clip(title); ref = clip(ref);
  const strip = s => String(s||'').replace(/\b(lms|last man standing|football|footy|pot|entry|entries)\b/ig,' ')
                      .replace(/[^A-Za-z'’\- ]+/g,' ').replace(/\s+/g,' ').trim();
  const dedupe = s => { const w = s.split(' '); const out = [];
    w.forEach(x => { if (!out.some(y => y.toLowerCase() === x.toLowerCase())) out.push(x); }); return out.join(' '); };
  const good = s => s && s.split(' ').length >= 2 && s.split(' ').every(w => w.length >= 2);
  const r1 = dedupe(strip(ref)), t1 = dedupe(strip(title));
  if (good(r1)) return L.titleCase(r1);
  if (good(t1)) return L.titleCase(t1);
  return L.titleCase(t1 || r1 || '');
}

function flagsPush(review, p, had, want, x){
  review.push({ id:uid(), kind:'entrant', personId:p.id, entryIds:[], sender:x.sender,
    flags:['paid for ' + had + ' lines but the chat only accounts for ' + want],
    quote:x.quote, confidence:'low', done:false });
}

/* ---------- the queue ---------- */
function renderReview(r){
  const q = (r.review || []).filter(x => !x.done);
  const active = (r.review || []).filter(x => !x.second);   // parked ones don't count
  const total = active.length, done = Math.max(0, total - q.length);
  if (!total){
    $('#p-review').innerHTML = `<div class="done-state"><div class="tick">—</div><h2>Nothing to check</h2>
      <p class="hint">Build the list first and anything uncertain will land here.</p>
      <button class="btn" data-act="go" data-page="home">Build the list</button></div>`;
    return;
  }
  if (!q.length){
    const parked = (r.review||[]).filter(x=>x.second).length;
    $('#p-review').innerHTML = `<div class="done-state"><div class="tick">✓</div><h2>Done</h2>
      <p class="hint">${r.entries.length} lines · ${r.entries.filter(e=>e.paid).length} paid ·
      ${r.entries.filter(e=>!(r.picks[e.id]||{})[1]).length} still without a team.</p>
      <p class="hint">On a phone, browsers clear site data for sites left unused for a week.
      Download a backup when you finish and you can restore it from Settings.</p>
      ${parked?`<p class="hint">${parked} more were near enough that I didn't ask — mostly people whose WhatsApp name
        differs from the name they typed. Worth a skim if you want to be thorough.</p>`:''}
      <div class="row" style="justify-content:center">
        <button class="btn" data-act="go" data-page="list">Produce the spreadsheet</button>
        ${parked?`<button class="btn ghost" data-act="reviewSecond">Check the other ${parked}</button>`:''}
        <button class="btn ghost" data-act="exportJson">Download a backup</button>
        <button class="btn ghost" data-act="reviewReopen">Start over</button>
      </div></div>`;
    return;
  }
  ui.reviewIdx = Math.min(ui.reviewIdx || 0, q.length - 1);
  const item = q[ui.reviewIdx];
  $('#p-review').innerHTML = `
  <div class="prog">
    <span class="mini">${done + (ui.reviewIdx||0) + 1} of ${total}</span>
    <span class="bar"><span style="width:${Math.round(done/total*100)}%"></span></span>
    <span class="mini">${q.length} left</span>
  </div>
  ${reviewCard(r, item)}`;
}

function reviewCard(r, it){
  const skip = `<button class="btn ghost" data-act="reviewSkip" data-id="${it.id}">Skip for now</button>`;
  if (it.kind === 'entrant'){
    const p = person(it.personId) || {name:'?'};
    const entries = it.entryIds.map(id => r.entries.find(e=>e.id===id)).filter(Boolean);
    return `<div class="qcard">
      <span class="pill ${it.confidence==='low'?'out':'review'}">${it.confidence==='low'?"I'm guessing here":'worth a glance'}</span>
      <h2 style="margin-top:10px">Is this right?</h2>
      <p class="hint" style="margin:0">${esc(it.flags.join(' · ')) || 'Just double-checking.'}</p>
      <div class="said">${esc(it.quote)}</div>
      <p class="mini">Sent by <strong>${esc(it.sender||'unknown')}</strong></p>
      <div class="qgrid">
        <div><label class="f" for="rvName">Their name</label>
          <input type="text" id="rvName" value="${esc(p.name)}" data-act="rvName" data-id="${it.id}"></div>
        <div><label class="f" for="rvLines">Lines</label>
          <input type="number" id="rvLines" value="${entries.length}" min="1" max="20" data-act="rvLines" data-id="${it.id}"></div>
        <div><label class="f">Paid</label>
          <label class="chk"><input type="checkbox" ${entries[0]&&entries[0].paid?'checked':''} data-act="rvPaid" data-id="${it.id}"> yes</label></div>
      </div>
      ${entries.map((e,i)=>`<div class="row" style="margin-bottom:8px">
        <span class="mini" style="width:60px">Line ${i+1}</span>
        <select data-act="rvPick" data-eid="${e.id}" style="max-width:260px">
          <option value="">— no team yet —</option>
          ${seasonClubs().map(c=>`<option value="${esc(c)}" ${(r.picks[e.id]||{})[1]===c?'selected':''}>${esc(c)}</option>`).join('')}
        </select></div>`).join('')}
      <div class="qbar">
        <button class="btn" data-act="reviewOk" data-id="${it.id}">That's right →</button>
        ${skip}
        <button class="btn ghost" data-act="rvDrop" data-id="${it.id}">Not an entry — remove</button>
      </div></div>`;
  }
  if (it.kind === 'payment'){
    return `<div class="qcard">
      <span class="pill out">Payment I couldn't place</span>
      <h2 style="margin-top:10px">${money(it.row.amount)} from ${esc(it.row.name)}</h2>
      <p class="hint" style="margin:0">${esc(it.flags.join(' · '))}</p>
      <div class="said">${esc(it.row.date)}  ${esc(it.row.name)}  ${money(it.row.amount)}${it.row.detail?'\n'+esc(it.row.detail):''}</div>
      <label class="f">Whose lines does this cover?</label>
      <select multiple size="6" data-act="rvAssign" data-id="${it.id}" style="min-height:150px">
        ${r.entries.map(e=>`<option value="${e.id}" ${it.suggested.includes(e.id)?'selected':''}>${esc(entryName(e))}${e.paid?' · already paid':''}</option>`).join('')}
      </select>
      <div class="qbar">
        <button class="btn" data-act="rvApplyPay" data-id="${it.id}">Mark those as paid →</button>
        ${skip}
        <button class="btn ghost" data-act="reviewOk" data-id="${it.id}">Not for this game</button>
      </div></div>`;
  }
  if (it.kind === 'unsure' || it.kind === 'unpaidclaim'){
    const p = person(it.personId) || {name:'?'};
    return `<div class="qcard">
      <span class="pill review">Unsure — did they pay?</span>
      <h2 style="margin-top:10px">${esc(p.name)}</h2>
      <p class="hint" style="margin:0">They said they'd paid in the group, but nothing in the statement matches that name.
      It may be a payment under a different name, or it may not have arrived.</p>
      ${p.quote?`<div class="said">${esc(p.quote)}</div>`:''}
      <div class="qbar">
        <button class="btn" data-act="rvTrust" data-id="${it.id}">Mark as paid →</button>
        <button class="btn ghost" data-act="rvUnpaid" data-id="${it.id}">Not paid — chase them</button>
        ${skip}
      </div></div>`;
  }
  if (it.kind === 'pick'){
    const e = r.entries.find(z=>z.id===it.entryId);
    if (!e) return `<div class="qcard"><p>That entry has gone.</p><div class="qbar">
      <button class="btn" data-act="reviewOk" data-id="${it.id}">Next →</button></div></div>`;
    return `<div class="qcard">
      <span class="pill review">No team yet</span>
      <h2 style="margin-top:10px">${esc(entryName(e))}</h2>
      <p class="hint" style="margin:0">Nothing in the chat gave a team for this line.</p>
      ${person(e.personId)&&person(e.personId).quote?`<div class="said">${esc(person(e.personId).quote)}</div>`:''}
      <label class="f">Team</label>
      <select data-act="rvPick" data-eid="${e.id}" style="max-width:280px">
        <option value="">— still to pick —</option>
        ${seasonClubs().map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('')}
      </select>
      <div class="qbar">
        <button class="btn" data-act="reviewOk" data-id="${it.id}">Save and next →</button>
        <button class="btn ghost" data-act="reviewSkip" data-id="${it.id}">Chase them later</button>
      </div></div>`;
  }
  return '';
}

const revItem = id => (round().review || []).find(x => x.id === id);
ACT.reviewOk    = function(el){ const i = revItem(el.dataset.id); if (i) i.done = true; save(); render(); };
ACT.reviewSkip  = function(){ ui.reviewIdx = (ui.reviewIdx || 0) + 1; render(); };
ACT.reviewSecond= function(){ (round().review||[]).forEach(x=>{ if(x.second){ x.done=false; x.second=false; } }); ui.reviewIdx=0; save(); render(); };
ACT.reviewReopen= function(){ (round().review||[]).forEach(x=>x.done=false); ui.reviewIdx=0; save(); render(); };
ACT.rvName = function(el){
  const it = revItem(el.dataset.id); if (!it) return;
  const p = person(it.personId); if (p) p.name = el.value;
  save();
};
ACT.rvLines = function(el){
  const r = round(), it = revItem(el.dataset.id); if (!it) return;
  const want = Math.max(1, Math.min(20, +el.value || 1));
  let have = it.entryIds.map(id => r.entries.find(e=>e.id===id)).filter(Boolean);
  while (have.length > want){
    const gone = have.pop();
    r.entries = r.entries.filter(e => e.id !== gone.id);
    delete r.picks[gone.id];
    it.entryIds = it.entryIds.filter(z => z !== gone.id);
  }
  while (have.length < want){
    const e = { id:uid(), personId:it.personId, line:have.length+1, of:want, paid:have[0]?have[0].paid:false,
                paidAmount:0, paidDate:'', paidRef:'', paidBy:'', status:'alive', eliminatedGw:null };
    r.entries.push(e); it.entryIds.push(e.id); have.push(e);
  }
  have.forEach((e,i) => { e.line = i+1; e.of = want; });
  save(); render();
};
ACT.rvPaid = function(el){
  const r = round(), it = revItem(el.dataset.id); if (!it) return;
  it.entryIds.forEach(id => { const e = r.entries.find(z=>z.id===id);
    if (e){ e.paid = el.checked; e.paidAmount = el.checked ? (r.fee||11) : 0;
            e.paidRef = el.checked ? (e.paidRef || 'confirmed by you') : ''; } });
  save(); render();
};
ACT.rvPick = function(el){
  const r = round(), id = el.dataset.eid;
  r.picks[id] = r.picks[id] || {};
  if (el.value) r.picks[id][1] = el.value; else delete r.picks[id][1];
  save();
};
ACT.rvDrop = function(el){
  const r = round(), it = revItem(el.dataset.id); if (!it) return;
  if (!confirm('Remove this from the list entirely?')) return;
  r.entries = r.entries.filter(e => !it.entryIds.includes(e.id));
  it.entryIds.forEach(id => delete r.picks[id]);
  it.done = true; save(); render(); toast('Removed.');
};
ACT.rvAssign = function(el){
  const it = revItem(el.dataset.id); if (!it) return;
  it.suggested = [...el.selectedOptions].map(o => o.value);
};
ACT.rvApplyPay = function(el){
  const r = round(), it = revItem(el.dataset.id); if (!it) return;
  it.suggested.forEach(id => { const e = r.entries.find(z=>z.id===id);
    if (e){ e.paid = true; e.bankPaid = true; e.paidAmount = r.fee||11;
            e.paidDate = it.row.date; e.paidRef = it.row.name; } });
  it.done = true; save(); render();
  toast(it.suggested.length + ' marked paid.');
};
ACT.rvTrust = function(el){
  const r = round(), it = revItem(el.dataset.id); if (!it) return;
  it.entryIds.forEach(id => { const e = r.entries.find(z=>z.id===id);
    if (e){ e.paid = true; e.bankPaid = true; e.paidRef = 'confirmed by you'; } });
  it.done = true; save(); render();
};
ACT.rvUnpaid = function(el){
  const r = round(), it = revItem(el.dataset.id); if (!it) return;
  it.entryIds.forEach(id => { const e = r.entries.find(z=>z.id===id);
    if (e){ e.paid = false; e.paidAmount = 0; e.paidRef = ''; } });
  it.done = true; save(); render();
};

/* One row per person: have they paid, and what did they pick. Payment state has
   three values, not two — the bank confirms it, or they only said so in the group. */
/* Two states, because that's the only question Greg is asking: is the money there.
   A claim in the group chat isn't payment — it's a reason to look harder at a
   name the statement didn't match. */
function payState(lines){
  if (lines.some(e => e.bankPaid)) return { k:'paid', pill:'through', label:'paid', note:'' };
  const claimed = lines.some(e => e.saidPaid || e.paid);
  if (claimed) return { k:'unsure', pill:'review', label:'unsure',
                        note:'says paid in the group, nothing matching in the statement', claimed:true };
  return { k:'none', pill:'out', label:'not paid', note:'', claimed:false };
}
function listPeople(r){
  const by = new Map();
  r.entries.forEach(e => {
    if (!by.has(e.personId)) by.set(e.personId, []);
    by.get(e.personId).push(e);
  });
  const flagged = new Set();
  (r.review||[]).forEach(x => { if (!x.done && x.personId) flagged.add(x.personId); });
  return [...by.entries()].map(([pid, lines]) => {
    lines.sort((a,b)=>(a.line||1)-(b.line||1));
    const p = person(pid) || { name:'(unknown)' };
    const pay = payState(lines);
    return { pid, name:p.name, lines, pay, claimed:!!pay.claimed, silent:(r.silent||[]).includes(pid),
             picks: lines.map(e => (r.picks[e.id]||{})[1] || null),
             needsCheck: flagged.has(pid),
             ref: (lines.find(e=>e.paidRef)||{}).paidRef || '' };
  }).sort((a,b) => a.name.localeCompare(b.name));
}

  ${rows.length===0?'<p class="hint">Nothing matches that.</p>':''}`

/* ============================================================
   GREG'S WEEKLY SHEET — the thing he posts to the group
   ============================================================ */

/* His shorthand, not mine. He pastes this straight out, so "Nott'm Forest"
   has to say Nott'm Forest. */
const SHEET_NAME = {
  'Manchester United':'Man Utd', 'Manchester City':'Man City',
  'Nottingham Forest':"Nott'm Forest", 'Tottenham Hotspur':'Tottenham',
  'Ipswich Town':'Ipswich', 'Leeds United':'Leeds', 'Leicester City':'Leicester',
  'Brighton & Hove Albion':'Brighton', 'AFC Bournemouth':'Bournemouth',
  'Newcastle United':'Newcastle', 'West Ham United':'West Ham',
  'Wolverhampton Wanderers':'Wolves', 'Sheffield United':'Sheff Utd'
};
const sheetTeam = c => SHEET_NAME[c] || c || '';

/** One row per line, named the way Greg names them: "Adam Hunt 1", "Adam Hunt 2". */
function sheetRows(r){
  const byPerson = new Map();
  r.entries.forEach(e => {
    if (!byPerson.has(e.personId)) byPerson.set(e.personId, []);
    byPerson.get(e.personId).push(e);
  });
  const out = [];
  byPerson.forEach((lines, pid) => {
    const p = person(pid) || { name:'(unknown)' };
    lines.sort((a,b) => (a.line||1) - (b.line||1));
    lines.forEach((e, i) => {
      out.push({
        name: lines.length > 1 ? p.name + ' ' + (i+1) : p.name,
        entry: e,
        weeks: Array.from({length: Math.max(14, r.currentGw)}, (_, w) =>
          sheetTeam((r.picks[e.id]||{})[w+1]))
      });
    });
  });
  return out.sort((a,b) => a.name.localeCompare(b.name, 'en', { sensitivity:'base' }));
}

function sheetCsv(r){
  const weeks = Math.max(14, r.currentGw);
  const q = s => /[",\n]/.test(String(s)) ? '"' + String(s).replace(/"/g,'""') + '"' : String(s);
  const head = ['Name'].concat(Array.from({length:weeks},(_,i)=>'Week ' + (i+1)));
  const body = sheetRows(r).map(x => [x.name].concat(x.weeks.slice(0, weeks)));
  return [head].concat(body).map(row => row.map(q).join(',')).join('\n');
}

ACT.downloadSheet = function(){
  const r = round();
  const rows = sheetRows(r);
  if (!rows.length) return toast('Nothing to export yet.');
  download('Last Man Standing.csv', sheetCsv(r), 'text/csv');
  toast(rows.length + ' lines exported in Greg’s format.');
};

/** The short version for the group: who's left and who went this week. */
ACT.copyWeekPost = function(){
  const r = round(), gw = ui.pickGw || r.currentGw;
  const alive = aliveEntries(r);
  const out = r.entries.filter(e => e.status === 'out' && e.eliminatedGw === gw);
  const rows = sheetRows(r);
  const nameOf = e => (rows.find(x => x.entry.id === e.id) || {}).name || entryName(e);
  const tally = {};
  alive.forEach(e => { const c = (r.picks[e.id]||{})[gw]; if (c) tally[sheetTeam(c)] = (tally[sheetTeam(c)]||0) + 1; });
  const lines = [];
  lines.push('Week ' + gw + ' picks');
  lines.push('');
  Object.entries(tally).sort((a,b) => b[1]-a[1] || a[0].localeCompare(b[0]))
    .forEach(([c,n]) => lines.push(n + ' x ' + c));
  lines.push('');
  lines.push(alive.length + '/' + r.entries.length);
  if (out.length){
    lines.push('');
    lines.push('Out this week (' + out.length + ')');
    out.slice(0, 60).forEach(e => lines.push(nameOf(e) + ' - ' + sheetTeam((r.picks[e.id]||{})[gw])));
    if (out.length > 60) lines.push('…and ' + (out.length - 60) + ' more');
  }
  const txt = lines.join('\n');
  navigator.clipboard ? navigator.clipboard.writeText(txt).then(()=>toast('Copied — paste it into the group.'), ()=>prompt('Copy this:', txt))
                      : prompt('Copy this:', txt);
};


/* ---------- writing a real .xlsx ----------
   An xlsx is a zip of XML. We already unzip, so this closes the loop: Greg gets a
   file that opens in Excel, Numbers or Sheets exactly like the one he keeps now. */
const CRC_TABLE = (function(){
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++){
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(bytes){
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
async function zipFile(files){            // [{name, text}] -> Blob
  const enc = new TextEncoder();
  const parts = [], central = [];
  let offset = 0;
  for (const f of files){
    const data = enc.encode(f.text);
    let out = data, method = 0;
    if (typeof CompressionStream !== 'undefined'){
      const cs = new Blob([data]).stream().pipeThrough(new CompressionStream('deflate-raw'));
      out = new Uint8Array(await new Response(cs).arrayBuffer());
      method = 8;
    }
    const nameBytes = enc.encode(f.name);
    const crc = crc32(data);
    const local = new DataView(new ArrayBuffer(30));
    local.setUint32(0, 0x04034b50, true); local.setUint16(4, 20, true); local.setUint16(6, 0, true);
    local.setUint16(8, method, true); local.setUint16(10, 0, true); local.setUint16(12, 0, true);
    local.setUint32(14, crc, true); local.setUint32(18, out.length, true);
    local.setUint32(22, data.length, true); local.setUint16(26, nameBytes.length, true);
    local.setUint16(28, 0, true);
    parts.push(new Uint8Array(local.buffer), nameBytes, out);
    const cen = new DataView(new ArrayBuffer(46));
    cen.setUint32(0, 0x02014b50, true); cen.setUint16(4, 20, true); cen.setUint16(6, 20, true);
    cen.setUint16(8, 0, true); cen.setUint16(10, method, true);
    cen.setUint32(16, crc, true); cen.setUint32(20, out.length, true);
    cen.setUint32(24, data.length, true); cen.setUint16(28, nameBytes.length, true);
    cen.setUint32(42, offset, true);
    central.push(new Uint8Array(cen.buffer), nameBytes);
    offset += 30 + nameBytes.length + out.length;
  }
  const cenSize = central.reduce((n,p) => n + p.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true);
  end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cenSize, true); end.setUint32(16, offset, true);
  return new Blob(parts.concat(central, [new Uint8Array(end.buffer)]), {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
const xmlEsc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');
function colRef(i){ let s=''; i++; while(i>0){ const m=(i-1)%26; s=String.fromCharCode(65+m)+s; i=((i-m)/26)|0; } return s; }

async function buildXlsx(rows){
  const sheet = rows.map((cells, ri) =>
    '<row r="' + (ri+1) + '">' + cells.map((v, ci) =>
      '<c r="' + colRef(ci) + (ri+1) + '" t="inlineStr"><is><t xml:space="preserve">' + xmlEsc(v) + '</t></is></c>'
    ).join('') + '</row>').join('');
  const files = [
    { name:'[Content_Types].xml', text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
      '<Default Extension="xml" ContentType="application/xml"/>' +
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
      '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>' },
    { name:'_rels/.rels', text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>' },
    { name:'xl/workbook.xml', text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" ' +
      'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
      '<sheets><sheet name="Sheet1" sheetId="1" r:id="rId1"/></sheets></workbook>' },
    { name:'xl/_rels/workbook.xml.rels', text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>' },
    { name:'xl/worksheets/sheet1.xml', text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>' + sheet + '</sheetData></worksheet>' }
  ];
  return await zipFile(files);
}

ACT.produceSheet = async function(){
  const r = round();
  const rows = sheetRows(r);
  if (!rows.length) return toast('Build the list first.');
  const weeks = Math.max(14, r.currentGw);
  const grid = [['Name'].concat(Array.from({length:weeks},(_,i)=>'Week ' + (i+1)))]
    .concat(rows.map(x => [x.name].concat(x.weeks.slice(0, weeks))));
  try {
    const blob = await buildXlsx(grid);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'Last Man Standing.xlsx';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
    toast(rows.length + ' lines written to Last Man Standing.xlsx');
  } catch(e){
    download('Last Man Standing.csv', sheetCsv(r), 'text/csv');
    toast("Couldn't build the Excel file, so you've got a CSV instead.");
  }
};

function boot(){
  state = load() || blankState();
  if (!state.settings) state.settings = blankState().settings;
  if (state.settings.seasonClubs === undefined) state.settings.seasonClubs = null;
  checkStorage();
  ensureRound();
  const r = round(); ui.pickGw = r.currentGw || 1;
  if ((r.review || []).some(x => !x.done)) ui.page = 'review';

  $$('nav button').forEach(b => b.addEventListener('click', ()=>go(b.dataset.page)));
  $('#roundSel').addEventListener('change', e=>{
    state.activeRoundId = e.target.value;
    const rr = round(); ui.pickGw = rr.currentGw || 1;
    ui.pendingPicks=[]; ui.pendingPays=[]; ui.settlePreview=null;
    save(); render();
  });
  document.addEventListener('change', e=>{
    if (e.target.id !== 'fileIn') return;
    const f = e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const obj = JSON.parse(rd.result);
        if (!obj.rounds) throw new Error('not an LMS backup');
        state = obj; ensureRound(); ui.pickGw = round().currentGw || 1;
        save(); render(); toast('Backup restored.');
      } catch(err){ toast("That file isn't an LMS backup."); }
    };
    rd.readAsText(f);
  });
  render();
  if (!state.people.length) toast('Empty tracker — try "Load demo data" in Settings.');
}
document.addEventListener('DOMContentLoaded', boot);
